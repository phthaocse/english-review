<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 790" role="img"
     aria-label="Four tiers: any browser reads the static site on GitHub Pages and writes through a Cloudflare Worker, which verifies Google tokens and calls Gemini, Oxford and D1; the Mac holds the Obsidian vault and publishes the site">
  <style>
    .t    { font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .h1   { font-size: 21px; font-weight: 700; fill: #1b1f2a; }
    .sub  { font-size: 13px; fill: #5b6275; }
    .tier { font-size: 12px; font-weight: 700; letter-spacing: .06em; }
    .stb  { font-size: 13px; font-weight: 700; fill: #1b1f2a; }
    .st   { font-size: 12.5px; fill: #3b4251; }
    .note { font-size: 11px; fill: #6b7183; }
    .edge { font-size: 11px; font-weight: 700; fill: #4f46e5; }
    .gap  { font-size: 11px; font-weight: 700; fill: #8a2a20; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f46e5"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392f"/>
    </marker>
  </defs>

  <rect width="960" height="790" fill="#ffffff"/>
  <text class="t h1"  x="32" y="38">English Review — system architecture</text>
  <text class="t sub" x="32" y="60">One static site, one Worker, and a Mac that owns the vault. Nothing else runs.</text>

  <!-- tier 1: device -->
  <rect x="32" y="82" width="896" height="112" rx="12" fill="#eef1f7" stroke="#d5dae5"/>
  <text class="t tier" x="48" y="104" fill="#5b6275">DEVICE — any browser, phone or laptop</text>
  <g>
    <rect x="48" y="114" width="276" height="66" rx="8" fill="#ffffff" stroke="#d5dae5"/>
    <text class="t stb"  x="62" y="134">app.js · review.js</text>
    <text class="t st"   x="62" y="152">Look up · Practise · Cards · Progress</text>
    <text class="t note" x="62" y="169">reads data/vocab.json — never the API</text>

    <rect x="342" y="114" width="276" height="66" rx="8" fill="#ffffff" stroke="#d5dae5"/>
    <text class="t stb"  x="356" y="134">capture.js · auth-client.js</text>
    <text class="t st"   x="356" y="152">type a word, or photograph a page</text>
    <text class="t note" x="356" y="169">the only code that calls the API</text>

    <rect x="636" y="114" width="276" height="66" rx="8" fill="#ffffff" stroke="#d5dae5"/>
    <text class="t stb"  x="650" y="134">localStorage</text>
    <text class="t st"   x="650" y="152">review progress · deck · theme</text>
    <text class="t note" x="650" y="169">per device; never leaves it</text>
  </g>

  <!-- tier 2 left: pages -->
  <rect x="32" y="232" width="430" height="142" rx="12" fill="#e9f1ec" stroke="#bcd4c4"/>
  <text class="t tier" x="48" y="254" fill="#2f6b4f">GITHUB PAGES — static, no build step</text>
  <text class="t st"   x="48" y="278">index.html · app.js · review.js · capture.js · styles.css</text>
  <text class="t st"   x="48" y="298">data/vocab.json — 204 items, generated on the Mac</text>
  <text class="t st"   x="48" y="318">assets/words/ — 204 SVG drawings + index.json</text>
  <text class="t note" x="48" y="344">Serves straight from main. Cached 600s, so a push lands within ~10 min.</text>

  <!-- tier 2 right: worker -->
  <rect x="498" y="232" width="430" height="142" rx="12" fill="#eceafe" stroke="#c3bdf5"/>
  <text class="t tier" x="514" y="254" fill="#4f46e5">CLOUDFLARE WORKER — knowledge-api</text>
  <text class="t st"   x="514" y="278">index.js — routes: /api/me · /items · /vision · /logs</text>
  <text class="t st"   x="514" y="298">auth.js — verify Google ID token, then the allowlist</text>
  <text class="t st"   x="514" y="318">gemini.js — photo to draft · oxford.js — the meaning</text>
  <text class="t st"   x="514" y="338">db.js — queries · region.js — Durable Object relay</text>
  <text class="t note" x="514" y="362">Holds every Gemini key as a secret. 50 reads per person per day.</text>

  <!-- tier 3 left: third parties -->
  <rect x="32" y="412" width="430" height="126" rx="12" fill="#f7f8fb" stroke="#d5dae5"/>
  <text class="t tier" x="48" y="434" fill="#5b6275">THIRD PARTIES</text>
  <text class="t st"   x="48" y="458">Google Identity — sign-in button, JWKS signing keys</text>
  <text class="t st"   x="48" y="478">Gemini 3.5 Flash — free tier, 20 requests a day per model</text>
  <text class="t st"   x="48" y="498">Oxford Learner's Dictionaries — plain GET, browser User-Agent</text>
  <text class="t note" x="48" y="522">Gemini is reached through the relay, pinned to a region it serves.</text>

  <!-- tier 3 right: d1 -->
  <rect x="498" y="412" width="430" height="126" rx="12" fill="#f1f2f6" stroke="#d5dae5"/>
  <text class="t tier" x="514" y="434" fill="#5b6275">D1 — knowledge (SQLite at the edge)</text>
  <text class="t st"   x="514" y="458">user (the allowlist) · item · example · sense · tag</text>
  <text class="t st"   x="514" y="478">usage_counter — daily cap · vision_log — every read</text>
  <text class="t st"   x="514" y="498">review_state · review_log — tables exist, nothing writes them</text>
  <text class="t note" x="514" y="522">UNIQUE (term, kind) is the duplicate check; a repeat merges.</text>

  <!-- tier 4: the mac -->
  <rect x="32" y="576" width="896" height="172" rx="12" fill="#fbf5e9" stroke="#e3d6b8"/>
  <text class="t tier" x="48" y="598" fill="#8a6d1f">THE MAC — the vault lives here, on an external drive</text>
  <g>
    <rect x="48" y="610" width="276" height="120" rx="8" fill="#ffffff" stroke="#e3d6b8"/>
    <text class="t stb"  x="62" y="632">Obsidian vault</text>
    <text class="t st"   x="62" y="652">Markdown, one note per item</text>
    <text class="t st"   x="62" y="671">the source of truth</text>
    <text class="t note" x="62" y="693">Unreachable from CI, which is</text>
    <text class="t note" x="62" y="709">why the data file is committed.</text>

    <rect x="342" y="610" width="276" height="120" rx="8" fill="#ffffff" stroke="#e3d6b8"/>
    <text class="t stb"  x="356" y="632">english-vocab agent</text>
    <text class="t st"   x="356" y="652">looks Oxford up in a browser</text>
    <text class="t st"   x="356" y="671">writes the note, draws the SVG</text>
    <text class="t note" x="356" y="693">No API key on this route, so</text>
    <text class="t note" x="356" y="709">no quota is spent.</text>

    <rect x="636" y="610" width="276" height="120" rx="8" fill="#ffffff" stroke="#e3d6b8"/>
    <text class="t stb"  x="650" y="632">_System/Scripts</text>
    <text class="t st"   x="650" y="652">build_site.py → vocab.json</text>
    <text class="t st"   x="650" y="671">build_anki_csv.py · build_docx.py</text>
    <text class="t note" x="650" y="693">publish_site.sh regenerates,</text>
    <text class="t note" x="650" y="709">commits and pushes.</text>
  </g>

  <!-- edges -->
  <g fill="none" stroke="#4f46e5" stroke-width="2" marker-end="url(#a)">
    <path d="M186 180 V226"/>
    <path d="M480 180 V206 H660 V226"/>
    <path d="M600 376 V406"/>
    <path d="M540 376 L470 408"/>
    <path d="M32 664 H18 V300 H26"/>
  </g>
  <text class="t edge" x="196" y="206">GET static files</text>
  <text class="t edge" x="494" y="200">POST /api/… + Bearer ID token</text>
  <text class="t edge" x="608" y="396">read / write</text>
  <text class="t edge" x="352" y="398" text-anchor="end">verify · read · draft</text>
  <text class="t edge" x="24" y="470" transform="rotate(-90 24 470)" text-anchor="middle">git push</text>

  <!-- the gap -->
  <g fill="none" stroke="#c0392f" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)">
    <path d="M928 664 H944 V478 H932"/>
  </g>
  <text class="t gap" x="920" y="560" text-anchor="end">Not built: the sync agent that would join D1 back to the vault — docs/sync.md</text>
</svg>
