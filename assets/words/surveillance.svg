<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A camera bolted to a wall, its cone of view thrown across two people walking below it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the cone of view: everything inside it is being watched -->
  <path d="M132 92 L142 240 L320 200 Z" fill="#4f46e5" fill-opacity=".26"/>
  <path d="M132 92 L142 240" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path d="M132 92 L320 200" stroke="#4f46e5" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- the wall and the bracket holding it up -->
  <rect x="0" y="0" width="26" height="240" fill="#9aa2b4"/>
  <path d="M26 44 L58 58" stroke="#7b8399" stroke-width="10" stroke-linecap="round"/>
  <!-- the camera -->
  <g transform="rotate(22 96 68)">
    <rect x="50" y="48" width="92" height="40" rx="10" fill="#7b8399"/>
    <rect x="134" y="52" width="16" height="32" rx="5" fill="#9aa2b4"/>
    <circle cx="140" cy="68" r="11" fill="#4f46e5"/>
  </g>
  <!-- the light that says it is running -->
  <circle cx="72" cy="40" r="6" fill="#c0392f"/>
  <!-- the ground, and the two people on it who did not choose this -->
  <path d="M26 216 H320" stroke="#7b8399" stroke-width="4"/>
  <g fill="#4f46e5">
    <circle cx="184" cy="176" r="11"/><path d="M172 216 L173 191 Q184 185 195 191 L196 216 Z"/>
    <circle cx="242" cy="176" r="11"/><path d="M230 216 L231 191 Q242 185 253 191 L254 216 Z"/>
  </g>
</svg>
