<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Five numbered bars stacked top to bottom, the first the longest and each one after it shorter">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ranked items: longest at the top is the one that matters most -->
  <g fill="#4f46e5">
    <rect x="60" y="30" width="200" height="30" rx="5"/>
    <rect x="76" y="68" width="168" height="30" rx="5"/>
    <rect x="92" y="106" width="136" height="30" rx="5"/>
    <rect x="108" y="144" width="104" height="30" rx="5"/>
    <rect x="124" y="182" width="72" height="30" rx="5"/>
  </g>
  <!-- their rank, spelled out so the order is not just implied -->
  <g>
    <text x="73" y="52" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#eef0f5">1</text>
    <text x="89" y="90" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#eef0f5">2</text>
    <text x="105" y="128" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#eef0f5">3</text>
    <text x="121" y="166" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#eef0f5">4</text>
    <text x="137" y="204" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#eef0f5">5</text>
  </g>
  <!-- importance falling away down the list -->
  <g fill="none" stroke="#c0392f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M288 34 V196"/><path d="M278 186 L288 200 L298 186"/>
  </g>
</svg>
