<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two panels: on the left a block coming down slowly through faint ghost positions into the one gap in a row, lined up by dashed guides; on the right a person standing beside a balance weighing one thing against another">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- one spelling, two quite different words -->
  <path d="M160 22 L160 218" stroke="#9aa2b4" stroke-width="2"/>

  <!-- meant, not accidental: the block is lined up and set down inch by inch -->
  <g stroke="#9aa2b4" stroke-width="2" stroke-dasharray="5 6">
    <path d="M60 44 L60 214"/><path d="M106 44 L106 214"/>
  </g>
  <rect x="60" y="48" width="46" height="32" rx="4" fill="#4f46e5"/>
  <g fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="7 6" opacity=".75">
    <rect x="60" y="94" width="46" height="32" rx="4"/>
    <rect x="60" y="134" width="46" height="32" rx="4"/>
  </g>
  <polygon points="83,180 72,162 94,162" fill="#4f46e5"/>
  <g fill="#9aa2b4">
    <rect x="8" y="182" width="44" height="34" rx="4"/>
    <rect x="114" y="182" width="40" height="34" rx="4"/>
  </g>
  <rect x="60" y="182" width="46" height="34" rx="4" fill="none" stroke="#4f46e5"
        stroke-width="4" stroke-dasharray="8 7"/>

  <!-- to think it over: the same spelling, one thing weighed against another -->
  <g fill="#4f46e5" stroke="#4f46e5" stroke-width="8" stroke-linecap="round">
    <circle cx="186" cy="138" r="14" stroke="none"/>
    <path d="M186 154 L186 188"/>
    <path d="M172 164 L200 164"/>
    <path d="M186 188 L175 216"/>
    <path d="M186 188 L197 216"/>
  </g>
  <g fill="#7b8399">
    <rect x="232" y="210" width="64" height="9" rx="4"/>
    <rect x="260" y="140" width="8" height="72"/>
    <path d="M210 166 Q228 184, 246 166 Z"/>
    <path d="M278 150 Q296 168, 314 150 Z"/>
  </g>
  <path d="M228 150 L296 134" stroke="#7b8399" stroke-width="6" stroke-linecap="round"/>
  <g stroke="#7b8399" stroke-width="3">
    <path d="M228 150 L228 166"/><path d="M296 134 L296 150"/>
  </g>
  <rect x="219" y="152" width="18" height="14" fill="#4f46e5"/>
  <rect x="287" y="136" width="18" height="14" fill="#c9a227"/>
</svg>
