<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person standing with a hand resting on a thick book whose page edges are crowded with coloured markers, more of them poking out of the top"
     >
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground they both stand on -->
  <path d="M16 218 H304" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- markers pushed in from the top of the book -->
  <g>
    <rect x="176" y="40" width="18" height="30" rx="3" fill="#e0b73a"/>
    <rect x="206" y="34" width="18" height="36" rx="3" fill="#c0392f"/>
    <rect x="236" y="44" width="18" height="26" rx="3" fill="#c9a227"/>
  </g>
  <!-- the book: spine, cover, and a thick block of pages -->
  <rect x="136" y="56" width="16" height="162" fill="#3730a3"/>
  <rect x="150" y="56" width="110" height="162" fill="#4f46e5"/>
  <rect x="254" y="62" width="28" height="150" fill="#ffffff" stroke="#9aa2b4" stroke-width="2"/>
  <g stroke="#9aa2b4" stroke-width="2">
    <path d="M254 80 H282"/><path d="M254 96 H282"/><path d="M254 112 H282"/>
    <path d="M254 128 H282"/><path d="M254 144 H282"/><path d="M254 160 H282"/>
    <path d="M254 176 H282"/><path d="M254 192 H282"/>
  </g>
  <!-- and the markers crowding its page edges -->
  <g>
    <rect x="276" y="72" width="28" height="13" rx="3" fill="#e0b73a"/>
    <rect x="276" y="100" width="28" height="13" rx="3" fill="#c0392f"/>
    <rect x="276" y="124" width="28" height="13" rx="3" fill="#c9a227"/>
    <rect x="276" y="150" width="28" height="13" rx="3" fill="#e0b73a"/>
    <rect x="276" y="178" width="28" height="13" rx="3" fill="#c0392f"/>
  </g>
  <g fill="#ffffff">
    <rect x="166" y="92" width="78" height="10" rx="3"/>
    <rect x="166" y="112" width="54" height="10" rx="3"/>
  </g>
  <!-- the person who has been through all of it -->
  <g stroke="#9aa2b4" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M64 176 L62 216"/>
    <path d="M84 176 L86 216"/>
    <path d="M56 126 L46 166"/>
    <path d="M92 126 L134 138"/>
  </g>
  <path d="M54 118 Q74 106 94 118 L98 178 L50 178 Z" fill="#9aa2b4"/>
  <circle cx="74" cy="92" r="21" fill="#9aa2b4"/>
  <circle cx="140" cy="140" r="10" fill="#9aa2b4"/>
</svg>
