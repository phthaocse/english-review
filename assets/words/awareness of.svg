<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person with a wide cone of attention spreading out in front of them, reaching a warning sign that now sits fully inside it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- what the person is taking in: a cone of attention widening as it goes out -->
  <path d="M74 114 L278 30 L278 202 Z" fill="#4f46e5" opacity="0.18"/>
  <g stroke="#4f46e5" stroke-width="3" stroke-dasharray="10 8" opacity="0.7">
    <path d="M74 114 L278 30"/><path d="M74 114 L278 202"/>
  </g>
  <!-- the person doing the noticing, turned towards it -->
  <circle cx="52" cy="118" r="22" fill="#4f46e5"/>
  <circle cx="63" cy="112" r="5" fill="#eef0f5"/>
  <path d="M20 218 Q20 152 52 148 Q84 152 84 218 Z" fill="#4f46e5"/>
  <!-- the hazard, sitting well inside the cone: it has been seen -->
  <path d="M226 68 L274 150 L178 150 Z" fill="#e0b73a" stroke="#a8841c"
        stroke-width="5" stroke-linejoin="round"/>
  <rect x="220" y="96" width="12" height="28" rx="6" fill="#c0392f"/>
  <circle cx="226" cy="136" r="6" fill="#c0392f"/>
</svg>
