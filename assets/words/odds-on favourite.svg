<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A betting board above a line of four runners: the bar belonging to one runner stretches right across the board while the other three are stubs, and that runner is the one drawn in colour">
  <rect width="320" height="240" fill="#eef0f5"/>
  <defs>
    <!-- one running figure, reused for the whole field -->
    <g id="runner">
      <circle cx="26" cy="9" r="9"/>
      <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 18 L18 36"/>
        <path d="M23 24 L37 17"/>
        <path d="M23 24 L9 30"/>
        <path d="M18 36 L30 45 L27 56"/>
        <path d="M18 36 L7 44 L12 56"/>
      </g>
    </g>
  </defs>
  <!-- the board: how much is riding on each of them -->
  <rect x="20" y="16" width="280" height="108" rx="8" fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <path d="M46 26 L46 114" stroke="#9aa2b4" stroke-width="3"/>
  <rect x="46" y="30" width="228" height="17" fill="#4f46e5"/>
  <g fill="#9aa2b4">
    <rect x="46" y="54" width="72" height="17"/>
    <rect x="46" y="78" width="48" height="17"/>
    <rect x="46" y="102" width="34" height="17"/>
  </g>
  <!-- the field itself, all still level -->
  <path d="M0 208 L320 208" stroke="#9aa2b4" stroke-width="3" stroke-dasharray="14 12"/>
  <g fill="#9aa2b4" stroke="#9aa2b4">
    <use href="#runner" x="94" y="150"/><use href="#runner" x="168" y="150"/><use href="#runner" x="242" y="150"/>
  </g>
  <g fill="#4f46e5" stroke="#4f46e5"><use href="#runner" x="20" y="150"/></g>
</svg>
