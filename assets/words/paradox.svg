<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="An impossible triangle whose three beams each meet the next quite normally, yet together close a loop that could not exist">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- beam running down to the right, furthest back of the three -->
  <g stroke="#2e2896" stroke-width="3" stroke-linejoin="round">
    <polygon points="101.2,22.0 244.9,104.9 218.8,120.0 75.1,37.1" fill="#6f68ea"/>
    <polygon points="244.9,135.1 218.8,150.2 218.8,120.0 244.9,104.9" fill="#4f46e5"/>
    <polygon points="75.1,67.2 218.8,150.2 218.8,120.0 75.1,37.1" fill="#3730a3"/>
  </g>
  <!-- beam running down to the left, which takes over where the first one ends -->
  <g stroke="#2e2896" stroke-width="3" stroke-linejoin="round">
    <polygon points="218.8,89.8 244.9,104.9 101.2,187.8 75.1,172.8" fill="#6f68ea"/>
    <polygon points="244.9,135.1 101.2,218.0 101.2,187.8 244.9,104.9" fill="#4f46e5"/>
    <polygon points="75.1,202.9 101.2,218.0 101.2,187.8 75.1,172.8" fill="#3730a3"/>
  </g>
  <!-- upright beam, nearest of all; its top face is what closes the loop -->
  <g stroke="#2e2896" stroke-width="3" stroke-linejoin="round">
    <polygon points="101.2,22.0 127.4,37.1 101.2,52.2 75.1,37.1" fill="#6f68ea"/>
    <polygon points="127.4,202.9 101.2,218.0 101.2,52.2 127.4,37.1" fill="#4f46e5"/>
    <polygon points="75.1,202.9 101.2,218.0 101.2,52.2 75.1,37.1" fill="#3730a3"/>
  </g>
</svg>
