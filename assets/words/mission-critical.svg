<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Three meshed gears driving a machine: the middle one is red and carries a red cross, and because of it the whole train has stopped dead at a red bar">
  <rect width="320" height="240" fill="#eef0f5"/>
  <defs>
    <!-- one gear, reused for all three parts of the machine -->
    <g id="gear">
      <circle cx="0" cy="0" r="30"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(45)"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(90)"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(135)"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(180)"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(225)"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(270)"/>
      <rect x="-7" y="-42" width="14" height="15" rx="2" transform="rotate(315)"/>
      <circle cx="0" cy="0" r="10" fill="#eef0f5"/>
    </g>
  </defs>
  <!-- the sound parts of the machine -->
  <use href="#gear" x="70" y="146" fill="#9aa2b4"/>
  <use href="#gear" x="210" y="146" fill="#9aa2b4"/>
  <!-- the one part everything else depends on -->
  <use href="#gear" x="140" y="114" fill="#c0392f"/>
  <circle cx="140" cy="114" r="21" fill="#ffffff"/>
  <g stroke="#c0392f" stroke-width="7" stroke-linecap="round">
    <path d="M129 103 L151 125"/><path d="M151 103 L129 125"/>
  </g>
  <!-- what the machine should have been delivering, halted -->
  <path d="M256 146 L288 146" stroke="#7b8399" stroke-width="7" stroke-linecap="round"/>
  <path d="M290 132 L290 160" stroke="#c0392f" stroke-width="12" stroke-linecap="round"/>
</svg>
