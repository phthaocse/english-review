<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Somebody walking out through an open doorway with their coat still on the hook behind them and a wall clock marking only a short wedge of time">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the clock, with the short slice they will be gone for -->
  <circle cx="58" cy="50" r="33" fill="#ffffff" stroke="#7b8399" stroke-width="5"/>
  <path d="M58 50 L58 17 A33 33 0 0 1 87 34 Z" fill="#c0392f"/>
  <g stroke="#7b8399" stroke-width="4" stroke-linecap="round">
    <path d="M58 22 L58 28"/><path d="M58 72 L58 78"/>
    <path d="M30 50 L36 50"/><path d="M80 50 L86 50"/>
  </g>
  <!-- the hook rail, and the coat that says they are coming back -->
  <rect x="20" y="98" width="82" height="9" rx="4" fill="#7b8399"/>
  <path d="M62 107 L62 116" stroke="#7b8399" stroke-width="6"/>
  <path d="M62 116 L36 138 L30 204 L94 204 L88 138 Z" fill="#6f68ea"/>
  <path d="M62 118 L62 204" stroke="#4f46e5" stroke-width="4"/>
  <path d="M50 124 L62 138 L74 124" fill="none" stroke="#4f46e5" stroke-width="5" stroke-linejoin="round"/>
  <!-- the doorway, standing open -->
  <rect x="160" y="30" width="112" height="198" fill="#dfe3ec" stroke="#7b8399" stroke-width="9"/>
  <path d="M0 228 L320 228" stroke="#7b8399" stroke-width="5"/>
  <!-- them, on the way through it -->
  <g stroke="#4f46e5" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M212 112 L216 156"/>
    <path d="M216 156 L200 226"/>
    <path d="M216 156 L240 220"/>
    <path d="M212 122 L192 148"/>
    <path d="M212 122 L234 146"/>
  </g>
  <circle cx="210" cy="94" r="16" fill="#4f46e5"/>
</svg>
