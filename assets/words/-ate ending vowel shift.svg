<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One word split into syllable blocks twice: as a verb the last block is full size and sounded long, as a noun the same block is shrunk and weak, while the stress dot stays over the first block in both">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the word used as a verb: the last syllable keeps its full long vowel -->
  <g>
    <text x="20" y="82" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7b8399">verb</text>
    <circle cx="115" cy="36" r="6" fill="#7b8399"/>
    <rect x="86" y="48" width="58" height="46" rx="8" fill="#4f46e5"/>
    <rect x="149" y="48" width="30" height="46" rx="8" fill="#4f46e5"/>
    <rect x="184" y="48" width="72" height="46" rx="8" fill="#c0392f"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="115" y="80">sep</text>
      <text x="164" y="80">a</text>
      <text x="220" y="80">rate</text>
    </g>
    <text x="220" y="119" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold"
          fill="#c0392f" text-anchor="middle">/e&#618;t/</text>
  </g>
  <!-- the line between the two readings of the one spelling -->
  <path d="M20 132 L300 132" stroke="#9aa2b4" stroke-width="2"/>
  <!-- the same word as a noun: the last syllable collapses to a weak vowel -->
  <g>
    <text x="20" y="192" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#7b8399">noun</text>
    <circle cx="115" cy="148" r="6" fill="#7b8399"/>
    <rect x="86" y="160" width="58" height="46" rx="8" fill="#4f46e5"/>
    <rect x="149" y="160" width="30" height="46" rx="8" fill="#4f46e5"/>
    <rect x="184" y="172" width="56" height="22" rx="6" fill="#9aa2b4"/>
    <g font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">
      <text x="115" y="192">sep</text>
      <text x="164" y="192">a</text>
    </g>
    <text x="212" y="190" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold"
          fill="#ffffff" text-anchor="middle">rate</text>
    <text x="212" y="228" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="bold"
          fill="#7b8399" text-anchor="middle">/&#601;t/</text>
  </g>
</svg>
