<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One walking figure split down the middle: the left half solid with a raised arm and a smile, the right half only a dashed outline with a dropped arm and a frown">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the half of them that is one way: solid, pleased, arm up -->
  <g fill="#4f46e5">
    <path d="M160 54 A42 42 0 0 0 160 138 Z"/>
    <path d="M160 142 L128 151 L122 200 L160 204 Z"/>
  </g>
  <g stroke="#4f46e5" stroke-width="15" stroke-linecap="round">
    <path d="M134 156 L98 118"/><path d="M140 202 L114 236"/>
  </g>
  <circle cx="140" cy="88" r="6" fill="#eef0f5"/>
  <path d="M126 112 Q143 127 158 119" fill="none" stroke="#eef0f5" stroke-width="5" stroke-linecap="round"/>
  <!-- the half that is the opposite: outline only, sour, arm down -->
  <g fill="none" stroke="#4f46e5" stroke-width="4" stroke-dasharray="9 7" stroke-linecap="round">
    <path d="M160 54 A42 42 0 0 1 160 138 Z"/>
    <path d="M160 142 L192 151 L198 200 L160 204 Z"/>
    <circle cx="180" cy="88" r="6"/>
    <path d="M186 156 L214 198" stroke-width="7"/>
    <path d="M180 202 L206 236" stroke-width="7"/>
  </g>
  <path d="M162 120 Q177 106 193 119" fill="none" stroke="#c0392f" stroke-width="5" stroke-linecap="round"/>
  <!-- the seam the two halves meet along -->
  <path d="M160 38 L160 238" stroke="#c0392f" stroke-width="3" stroke-dasharray="11 9"/>
</svg>
