<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One single person on the left with an arrow running to a verb block, and a small red tile carrying the letter s clipped onto the end of that block">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the one subject doing it -->
  <g fill="#4f46e5" stroke="#4f46e5" stroke-width="10" stroke-linecap="round">
    <circle cx="44" cy="92" r="18" stroke="none"/>
    <path d="M44 112 L44 158"/>
    <path d="M24 128 L64 128"/>
    <path d="M44 158 L28 196"/>
    <path d="M44 158 L60 196"/>
  </g>
  <!-- the subject reaching its verb -->
  <g stroke="#7b8399" stroke-width="6" stroke-linecap="round">
    <path d="M78 150 L98 150"/>
  </g>
  <polygon points="114,150 96,141 96,159" fill="#7b8399"/>
  <!-- the verb itself -->
  <rect x="122" y="118" width="116" height="64" rx="10" fill="#4f46e5"/>
  <text x="180" y="160" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#ffffff" text-anchor="middle">work</text>
  <!-- the ending that has just snapped onto it -->
  <rect x="240" y="118" width="52" height="64" rx="10" fill="#c0392f"/>
  <text x="266" y="160" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold"
        fill="#ffffff" text-anchor="middle">s</text>
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round">
    <path d="M266 76 L266 96"/>
  </g>
  <polygon points="266,110 256,92 276,92" fill="#c0392f"/>
</svg>
