<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A hooded figure holding a spray can in front of a wall they have scrawled red marks across">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the wall, and what it looked like before -->
  <rect x="192" y="20" width="128" height="196" fill="#9aa2b4"/>
  <g stroke="#7b8399" stroke-width="3">
    <path d="M192 68 H320"/><path d="M192 116 H320"/><path d="M192 164 H320"/>
    <path d="M256 20 V68"/><path d="M224 68 V116"/><path d="M256 116 V164"/><path d="M224 164 V216"/>
  </g>
  <!-- the damage, which is the whole of what the word means -->
  <g fill="none" stroke="#c0392f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 150 L236 78 L258 146 L282 74 L306 140"/>
    <path d="M214 176 Q258 190 302 172"/>
  </g>
  <!-- the figure, hood up so the face does not read -->
  <path d="M42 214 L48 132 Q96 112 144 132 L150 214 Z" fill="#4f46e5"/>
  <path d="M60 104 Q60 56 96 52 Q132 56 132 104 L132 120 Q96 138 60 120 Z" fill="#4f46e5"/>
  <ellipse cx="98" cy="98" rx="21" ry="24" fill="#7b8399"/>
  <!-- the arm and the can it is pointing at the wall -->
  <path d="M138 150 L166 124" stroke="#4f46e5" stroke-width="18" stroke-linecap="round"/>
  <rect x="150" y="102" width="46" height="24" rx="7" fill="#7b8399"/>
  <rect x="160" y="102" width="12" height="24" fill="#c0392f"/>
  <rect x="196" y="108" width="10" height="12" rx="3" fill="#9aa2b4"/>
  <!-- the spray leaving it -->
  <g fill="#c0392f">
    <circle cx="214" cy="100" r="4"/><circle cx="222" cy="114" r="3.5"/><circle cx="212" cy="126" r="4"/>
    <circle cx="232" cy="96" r="3"/><circle cx="234" cy="128" r="3"/>
  </g>
</svg>
