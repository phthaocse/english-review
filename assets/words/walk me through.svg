<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A flight of four steps marked off with one, two, three and four dots, and a hand with one finger out tracing a dashed route up along them">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the whole thing broken into steps you take one at a time -->
  <path d="M24 232 L24 204 L82 204 L82 176 L140 176 L140 148 L198 148 L198 120 L256 120 L256 232 Z"
        fill="#9aa2b4" stroke="#7b8399" stroke-width="3" stroke-linejoin="round"/>
  <!-- each step counted off, one dot more than the step below it -->
  <g fill="#4f46e5">
    <circle cx="53" cy="192" r="6"/>
    <circle cx="102" cy="164" r="6"/><circle cx="120" cy="164" r="6"/>
    <circle cx="155" cy="136" r="6"/><circle cx="169" cy="136" r="6"/><circle cx="183" cy="136" r="6"/>
    <circle cx="206" cy="108" r="6"/><circle cx="220" cy="108" r="6"/>
    <circle cx="234" cy="108" r="6"/><circle cx="248" cy="108" r="6"/>
  </g>
  <!-- the route the guide takes you along, one step to the next -->
  <path d="M30 176 Q120 130 232 74" fill="none" stroke="#7b8399" stroke-width="4"
        stroke-dasharray="10 9" stroke-linecap="round"/>
  <polygon points="224,62 250,70 228,90" fill="#7b8399"/>
  <!-- the guiding hand: fist closed, one finger out, running along the route -->
  <rect x="0" y="30" width="44" height="42" rx="12" fill="#4f46e5"/>
  <rect x="34" y="24" width="56" height="54" rx="18" fill="#4f46e5"/>
  <g fill="none" stroke="#eef0f5" stroke-width="3" stroke-linecap="round">
    <path d="M52 44 q16 -6 32 -1"/>
    <path d="M50 58 q16 -6 32 -1"/>
    <path d="M52 70 q14 -5 26 -1"/>
  </g>
  <path d="M40 76 L36 98" stroke="#4f46e5" stroke-width="14" stroke-linecap="round"/>
  <path d="M86 74 L126 116" stroke="#4f46e5" stroke-width="16" stroke-linecap="round"/>
</svg>
