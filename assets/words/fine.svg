<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A penalty notice demanding a sum of money, left tucked under the windscreen wiper of a car">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the car: bonnet along the bottom, windscreen above it -->
  <rect x="0" y="196" width="320" height="44" fill="#7b8399"/>
  <path d="M40 34 L280 24 L296 196 L18 196 Z" fill="#cdd3e0" stroke="#7b8399" stroke-width="6" stroke-linejoin="round"/>
  <!-- the notice, slipped under the blade -->
  <g transform="rotate(-7 146 142)">
    <rect x="88" y="92" width="116" height="100" rx="4" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
    <rect x="88" y="92" width="116" height="18" fill="#c0392f"/>
    <!-- the sum of money it demands -->
    <rect x="110" y="126" width="72" height="42" rx="5" fill="#2f6b4f"/>
    <ellipse cx="146" cy="147" rx="14" ry="12" fill="#eef0f5"/>
    <rect x="110" y="178" width="52" height="7" rx="3" fill="#9aa2b4"/>
  </g>
  <!-- the wiper holding it there: pivot, arm, blade -->
  <path d="M288 200 L150 58" stroke="#5c6270" stroke-width="7" stroke-linecap="round"/>
  <path d="M206 118 L152 62" stroke="#3f4450" stroke-width="14" stroke-linecap="round"/>
  <circle cx="288" cy="200" r="11" fill="#3f4450"/>
</svg>
