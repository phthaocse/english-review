<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="The side of a structure so big it runs off the left, top and right edges of the picture, its ladder climbing out of sight and one person at its foot no taller than the door beside them">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the thing itself: too large for the picture to hold -->
  <rect x="-30" y="-30" width="380" height="224" fill="#4f46e5"/>
  <g stroke="#3730a3" stroke-width="7">
    <path d="M0 36 H320"/><path d="M0 92 H320"/><path d="M0 148 H320"/>
  </g>
  <g fill="#3730a3">
    <circle cx="30" cy="64" r="5"/><circle cx="94" cy="64" r="5"/><circle cx="158" cy="64" r="5"/>
    <circle cx="222" cy="64" r="5"/><circle cx="286" cy="64" r="5"/>
    <circle cx="30" cy="120" r="5"/><circle cx="94" cy="120" r="5"/><circle cx="158" cy="120" r="5"/>
    <circle cx="222" cy="120" r="5"/><circle cx="286" cy="120" r="5"/>
  </g>
  <!-- a ladder at human spacing, climbing off the top of the picture -->
  <g stroke="#3730a3" stroke-width="6" stroke-linecap="round">
    <path d="M232 194 V-4"/><path d="M256 194 V-4"/>
    <path d="M232 178 H256"/><path d="M232 160 H256"/><path d="M232 142 H256"/>
    <path d="M232 124 H256"/><path d="M232 106 H256"/><path d="M232 88 H256"/>
    <path d="M232 70 H256"/><path d="M232 52 H256"/><path d="M232 34 H256"/>
    <path d="M232 16 H256"/>
  </g>
  <!-- an ordinary door at the foot of it, for something to measure against -->
  <rect x="88" y="156" width="24" height="38" fill="#eef0f5"/>
  <circle cx="106" cy="176" r="3" fill="#7b8399"/>
  <!-- the one person, who comes up no higher than that door -->
  <circle cx="150" cy="164" r="9" fill="#c0392f"/>
  <path d="M138 194 Q138 174 150 172 Q162 174 162 194 Z" fill="#c0392f"/>
  <!-- the ground they are both standing on -->
  <path d="M0 194 H320" stroke="#3730a3" stroke-width="6"/>
</svg>
