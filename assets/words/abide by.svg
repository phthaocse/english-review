<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person walking along a marked lane with both feet kept well inside the two lines, a board of rules standing beside the lane">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the marked lane: the two lines that must not be crossed -->
  <g stroke="#7b8399" stroke-width="5" stroke-linecap="round">
    <path d="M6 150 L314 150"/>
    <path d="M6 218 L314 218"/>
  </g>
  <!-- the track already walked, every print inside the lane -->
  <g fill="#9aa2b4">
    <ellipse cx="34" cy="196" rx="11" ry="6"/>
    <ellipse cx="62" cy="176" rx="11" ry="6"/>
    <ellipse cx="92" cy="196" rx="11" ry="6"/>
    <ellipse cx="120" cy="176" rx="11" ry="6"/>
  </g>
  <!-- the walker, keeping to the lane -->
  <circle cx="166" cy="64" r="19" fill="#4f46e5"/>
  <g fill="none" stroke="#4f46e5" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M166 84 L166 142"/>
    <path d="M166 100 L196 116"/>
    <path d="M166 100 L138 114"/>
    <path d="M166 142 L186 178 L184 198"/>
    <path d="M166 142 L146 176 L150 198"/>
  </g>
  <!-- the feet, both landing between the lines -->
  <g fill="#4f46e5">
    <ellipse cx="190" cy="200" rx="14" ry="7"/>
    <ellipse cx="146" cy="200" rx="14" ry="7"/>
  </g>
  <!-- the board of rules standing at the side of the lane -->
  <rect x="274" y="102" width="6" height="116" fill="#7b8399"/>
  <rect x="238" y="42" width="76" height="62" rx="5" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
  <g stroke="#9aa2b4" stroke-width="5" stroke-linecap="round">
    <path d="M250 60 L302 60"/><path d="M250 74 L302 74"/><path d="M250 88 L286 88"/>
  </g>
</svg>
