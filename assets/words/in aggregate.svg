<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Many small scattered marks on the left being swept by arrows into one single solid block on the right">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the scattered pieces, each too small to mean much on its own -->
  <g fill="#4f46e5">
    <rect x="18" y="34" width="20" height="20" rx="3" transform="rotate(14 28 44)"/>
    <rect x="66" y="22" width="18" height="18" rx="3" transform="rotate(-20 75 31)"/>
    <rect x="30" y="86" width="22" height="22" rx="3" transform="rotate(-8 41 97)"/>
    <rect x="84" y="72" width="18" height="18" rx="3" transform="rotate(26 93 81)"/>
    <rect x="16" y="140" width="20" height="20" rx="3" transform="rotate(32 26 150)"/>
    <rect x="72" y="126" width="22" height="22" rx="3" transform="rotate(-14 83 137)"/>
    <rect x="34" y="192" width="18" height="18" rx="3" transform="rotate(8 43 201)"/>
    <rect x="88" y="184" width="20" height="20" rx="3" transform="rotate(-28 98 194)"/>
  </g>
  <!-- arrows gathering them all towards one place -->
  <g stroke="#7b8399" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M118 44 C160 56, 168 88, 186 104"/>
    <path d="M118 120 L182 120"/>
    <path d="M118 196 C160 184, 168 152, 186 136"/>
  </g>
  <g fill="#7b8399">
    <path d="M194 110 L172 106 L182 90 Z"/>
    <path d="M196 120 L174 110 L174 130 Z"/>
    <path d="M194 130 L182 150 L172 134 Z"/>
  </g>
  <!-- and the single total they add up to -->
  <rect x="206" y="66" width="104" height="108" rx="10" fill="#4f46e5" stroke="#2e2896" stroke-width="5"/>
</svg>
