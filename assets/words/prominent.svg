<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A row of identical low pillars with a single one among them standing far taller and in a much stronger colour">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the line they all stand on -->
  <path d="M12 206 L308 206" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- the ordinary ones, all the same height as each other -->
  <g fill="#9aa2b4">
    <rect x="24" y="146" width="28" height="60" rx="14"/>
    <rect x="62" y="146" width="28" height="60" rx="14"/>
    <rect x="100" y="146" width="28" height="60" rx="14"/>
    <rect x="176" y="146" width="28" height="60" rx="14"/>
    <rect x="214" y="146" width="28" height="60" rx="14"/>
    <rect x="252" y="146" width="28" height="60" rx="14"/>
  </g>
  <!-- the one you cannot help noticing -->
  <rect x="136" y="48" width="32" height="158" rx="16" fill="#4f46e5"/>
</svg>
