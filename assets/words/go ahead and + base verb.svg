<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A traffic light showing green beside two word blocks: the plain form of the verb is ticked and the -ing form is crossed out in red">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the green light: permission is already given -->
  <rect x="20" y="36" width="60" height="150" rx="14" fill="#7b8399"/>
  <circle cx="50" cy="70" r="17" fill="#9aa2b4"/>
  <circle cx="50" cy="111" r="17" fill="#9aa2b4"/>
  <circle cx="50" cy="152" r="17" fill="#2f6b4f"/>
  <!-- the form that follows: the bare verb -->
  <rect x="104" y="54" width="132" height="46" rx="8" fill="#4f46e5"/>
  <text x="170" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#ffffff">ask</text>
  <path d="M252 78 L264 92 L292 58" fill="none" stroke="#2f6b4f"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the form that does not: the -ing verb -->
  <rect x="104" y="140" width="132" height="46" rx="8" fill="#9aa2b4"/>
  <text x="170" y="172" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" font-weight="bold" fill="#ffffff">asking</text>
  <g stroke="#c0392f" stroke-width="8" stroke-linecap="round">
    <path d="M252 146 L292 182"/><path d="M292 146 L252 182"/>
  </g>
</svg>
