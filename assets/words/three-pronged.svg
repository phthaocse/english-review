<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Three separate arrows coming in from three different directions and all striking the same bullseye">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the one thing all three are aimed at -->
  <circle cx="160" cy="120" r="46" fill="#eef0f5" stroke="#c0392f" stroke-width="5"/>
  <circle cx="160" cy="120" r="30" fill="none" stroke="#c0392f" stroke-width="5"/>
  <circle cx="160" cy="120" r="14" fill="#c0392f"/>
  <!-- three lines of attack, launched from different sides -->
  <g fill="#4f46e5" transform="translate(160 120)">
    <g transform="rotate(0)">
      <rect x="-120" y="-5" width="60" height="10" rx="5"/>
      <path d="M-64 -17 L-34 0 L-64 17 Z"/>
    </g>
    <g transform="rotate(115)">
      <rect x="-120" y="-5" width="60" height="10" rx="5"/>
      <path d="M-64 -17 L-34 0 L-64 17 Z"/>
    </g>
    <g transform="rotate(-115)">
      <rect x="-120" y="-5" width="60" height="10" rx="5"/>
      <path d="M-64 -17 L-34 0 L-64 17 Z"/>
    </g>
  </g>
</svg>
