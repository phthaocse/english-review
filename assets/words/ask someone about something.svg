<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One person with a question mark in a speech bubble, an arrow going from them across to a second person, and a further arrow from that person out to a box of written lines">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the question being put -->
  <polygon points="52,96 62,124 74,96" fill="#ffffff"/>
  <rect x="26" y="52" width="70" height="52" rx="12" fill="#ffffff" stroke="#4f46e5" stroke-width="3"/>
  <text x="61" y="92" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold"
        fill="#4f46e5" text-anchor="middle">?</text>
  <!-- the one who asks -->
  <g fill="#4f46e5" stroke="#4f46e5" stroke-width="9" stroke-linecap="round">
    <circle cx="62" cy="142" r="16" stroke="none"/>
    <path d="M62 160 L62 196"/>
    <path d="M44 172 L80 172"/>
    <path d="M62 196 L48 226"/>
    <path d="M62 196 L76 226"/>
  </g>
  <!-- ask SOMEONE: straight to the person -->
  <path d="M92 176 L132 176" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
  <polygon points="150,176 130,166 130,186" fill="#4f46e5"/>
  <!-- the one who is asked -->
  <g fill="#7b8399" stroke="#7b8399" stroke-width="9" stroke-linecap="round">
    <circle cx="182" cy="142" r="16" stroke="none"/>
    <path d="M182 160 L182 196"/>
    <path d="M164 172 L200 172"/>
    <path d="M182 196 L168 226"/>
    <path d="M182 196 L196 226"/>
  </g>
  <!-- ABOUT SOMETHING: on out to the subject being asked about -->
  <path d="M204 132 Q224 108, 238 96" fill="none" stroke="#7b8399" stroke-width="5" stroke-linecap="round"/>
  <polygon points="252,84 232,88 242,104" fill="#7b8399"/>
  <rect x="244" y="26" width="64" height="62" rx="6" fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <g stroke="#9aa2b4" stroke-width="5" stroke-linecap="round">
    <path d="M256 44 L296 44"/><path d="M256 58 L296 58"/><path d="M256 72 L280 72"/>
  </g>
</svg>
