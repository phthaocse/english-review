<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A surveyed map with contour rings and grid lines that stops at a ragged dashed border, beyond which the sheet is blank, and an arrow heading out into the blank part">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- everything that has been surveyed already -->
  <path d="M0 0 L176 0 C152 50 194 100 168 150 C150 190 182 214 176 240 L0 240 Z"
        fill="#9aa2b4" opacity=".38"/>
  <!-- the survey grid laid over it -->
  <g stroke="#7b8399" stroke-width="1.5" opacity=".7">
    <path d="M44 0 V240"/><path d="M110 0 V240"/>
    <path d="M0 64 H172"/><path d="M0 158 H170"/>
  </g>
  <!-- ground that has been walked and measured, ring by ring -->
  <g fill="none" stroke="#4f46e5" stroke-width="3">
    <ellipse cx="80" cy="104" rx="54" ry="40"/>
    <ellipse cx="80" cy="104" rx="35" ry="25"/>
    <ellipse cx="80" cy="104" rx="16" ry="11"/>
  </g>
  <!-- the edge of the survey: past this nothing has been filled in -->
  <path d="M176 0 C152 50 194 100 168 150 C150 190 182 214 176 240"
        fill="none" stroke="#c0392f" stroke-width="4" stroke-dasharray="11 9"/>
  <!-- the push outwards into the part still blank -->
  <g fill="#4f46e5">
    <rect x="120" y="190" width="126" height="8" rx="4"/>
    <path d="M240 180 L266 194 L240 208 Z"/>
  </g>
</svg>
