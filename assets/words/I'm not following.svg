<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two figures on a path, the one behind halted at the brink because the whole stretch of path between them has broken away into a gap">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the near side of the path, ending in a torn edge -->
  <path d="M0 150 L116 150 L100 180 L120 206 L102 240 L0 240 Z" fill="#9aa2b4"/>
  <rect x="0" y="150" width="112" height="11" fill="#7b8399"/>
  <!-- the far side, its own torn edge facing back across -->
  <path d="M212 150 L320 150 L320 240 L206 240 L222 206 L200 180 Z" fill="#9aa2b4"/>
  <rect x="210" y="150" width="110" height="11" fill="#7b8399"/>
  <!-- the two broken faces, picked out so the gap reads as a break -->
  <g fill="none" stroke="#c0392f" stroke-width="5" stroke-linejoin="round">
    <path d="M116 150 L100 180 L120 206 L102 240"/>
    <path d="M212 150 L200 180 L222 206 L206 240"/>
  </g>
  <!-- rubble that fell out of the missing stretch -->
  <g fill="#7b8399">
    <rect x="140" y="212" width="18" height="14" rx="3" transform="rotate(20 149 219)"/>
    <rect x="172" y="230" width="14" height="11" rx="3" transform="rotate(-26 179 235)"/>
    <rect x="156" y="182" width="11" height="9" rx="3" transform="rotate(38 161 186)"/>
  </g>
  <!-- the follower, stopped at the brink with a hand still reaching out -->
  <g stroke="#4f46e5" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M58 84 L54 122"/>
    <path d="M54 122 L38 150"/>
    <path d="M54 122 L72 150"/>
    <path d="M58 94 L100 84"/>
  </g>
  <circle cx="60" cy="62" r="16" fill="#4f46e5"/>
  <!-- the one in front, walking on, already well across -->
  <g stroke="#6f68ea" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M266 84 L268 122"/>
    <path d="M268 122 L252 150"/>
    <path d="M268 122 L286 150"/>
    <path d="M266 94 L248 108"/>
    <path d="M266 94 L284 104"/>
  </g>
  <circle cx="266" cy="62" r="15" fill="#6f68ea"/>
</svg>
