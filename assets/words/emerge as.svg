<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One shape rising up out of a crowd of faint identical shapes, its outline growing sharper and darker the higher it goes">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the crowd it starts in: all the same, none of them picked out -->
  <g fill="#9aa2b4" opacity=".4">
    <polygon points="46.0,159.0 64.1,172.1 57.2,193.4 34.8,193.4 27.9,172.1"/><polygon points="88.0,159.0 106.1,172.1 99.2,193.4 76.8,193.4 69.9,172.1"/><polygon points="214.0,159.0 232.1,172.1 225.2,193.4 202.8,193.4 195.9,172.1"/><polygon points="256.0,159.0 274.1,172.1 267.2,193.4 244.8,193.4 237.9,172.1"/>
    <polygon points="22.0,187.0 42.0,201.5 34.3,225.0 9.7,225.0 2.0,201.5"/><polygon points="64.0,187.0 84.0,201.5 76.3,225.0 51.7,225.0 44.0,201.5"/><polygon points="106.0,187.0 126.0,201.5 118.3,225.0 93.7,225.0 86.0,201.5"/><polygon points="196.0,187.0 216.0,201.5 208.3,225.0 183.7,225.0 176.0,201.5"/><polygon points="238.0,187.0 258.0,201.5 250.3,225.0 225.7,225.0 218.0,201.5"/><polygon points="280.0,187.0 300.0,201.5 292.3,225.0 267.7,225.0 260.0,201.5"/>
  </g>
  <!-- the one that is on its way up, drawn at three heights -->
  <polygon points="160.0,179.0 180.0,193.5 172.3,217.0 147.7,217.0 140.0,193.5" fill="#9aa2b4" opacity=".55"/>
  <polygon points="160.0,125.0 183.8,142.3 174.7,170.2 145.3,170.2 136.2,142.3" fill="#9aa2b4" stroke="#7b8399" stroke-width="3" opacity=".8"/>
  <polygon points="160.0,69.0 187.6,89.0 177.0,121.5 143.0,121.5 132.4,89.0" fill="#6f68ea" stroke="#4f46e5" stroke-width="4"/>
  <!-- and at the top, fully itself: recognised -->
  <polygon points="160.0,12.0 194.2,36.9 181.2,77.1 138.8,77.1 125.8,36.9" fill="#4f46e5" stroke="#2e2896" stroke-width="5" stroke-linejoin="round"/>
  <!-- chevrons at the sides marking the direction of travel -->
  <g fill="none" stroke="#7b8399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".8">
    <path d="M22 148 L38 128 L54 148"/><path d="M22 116 L38 96 L54 116"/>
    <path d="M266 148 L282 128 L298 148"/><path d="M266 116 L282 96 L298 116"/>
  </g>
</svg>
