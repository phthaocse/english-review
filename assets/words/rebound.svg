<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A ball dropping to the floor and springing back up again, its path traced as a dashed line that ends in an arrow">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the floor it comes off -->
  <path d="M16 198 L304 198" stroke="#7b8399" stroke-width="5" stroke-linecap="round"/>
  <!-- the way down, and the way back up -->
  <g fill="none" stroke="#7b8399" stroke-width="4" stroke-dasharray="10 9">
    <path d="M78 66 L150 176"/>
    <path d="M170 176 L222 92"/>
  </g>
  <path d="M212 96 L232 62 L236 98 Z" fill="#c0392f"/>
  <!-- where it started, faint because it has already left -->
  <circle cx="74" cy="48" r="17" fill="#4f46e5" opacity=".3"/>
  <!-- the moment of contact, squashed flat -->
  <ellipse cx="160" cy="186" rx="22" ry="11" fill="#4f46e5" opacity=".35"/>
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
    <path d="M134 192 L122 186"/>
    <path d="M186 192 L198 186"/>
    <path d="M142 176 L134 166"/>
    <path d="M178 176 L186 166"/>
  </g>
  <!-- and back up: the ball on its way out again -->
  <circle cx="244" cy="50" r="18" fill="#4f46e5"/>
</svg>
