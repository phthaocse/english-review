<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two bars side by side: a tall one for what people want and a short one for what is actually supplied, with the shortfall above the short bar hatched in red">
  <rect width="320" height="240" fill="#eef0f5"/>
  <defs>
    <clipPath id="unmet-gap"><rect x="182" y="52" width="68" height="84"/></clipPath>
  </defs>
  <!-- what is being asked for -->
  <rect x="72" y="52" width="68" height="154" fill="#4f46e5"/>
  <!-- what is actually there -->
  <rect x="182" y="136" width="68" height="70" fill="#9aa2b4"/>
  <!-- the part that is asked for and never gets filled -->
  <g clip-path="url(#unmet-gap)" stroke="#c0392f" stroke-width="4" opacity=".65">
      <path d="M-40 214 L144 30"/>
      <path d="M-24 214 L160 30"/>
      <path d="M-8 214 L176 30"/>
      <path d="M8 214 L192 30"/>
      <path d="M24 214 L208 30"/>
      <path d="M40 214 L224 30"/>
      <path d="M56 214 L240 30"/>
      <path d="M72 214 L256 30"/>
      <path d="M88 214 L272 30"/>
      <path d="M104 214 L288 30"/>
  </g>
  <rect x="182" y="52" width="68" height="84" fill="none" stroke="#c0392f" stroke-width="3" stroke-dasharray="9 7"/>
  <!-- the level the short bar would have to reach -->
  <path d="M140 52 H262" stroke="#c0392f" stroke-width="3" stroke-dasharray="9 7"/>
  <!-- the ground both bars stand on -->
  <rect x="40" y="206" width="244" height="7" rx="3" fill="#7b8399"/>
</svg>
