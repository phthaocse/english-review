<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A field of pale racehorses bunched together while one dark horse comes past them and takes the lead">
  <rect width="320" height="240" fill="#eef0f5"/>
  <defs>
    <!-- one racehorse with a jockey up, drawn once and reused in both colours -->
    <g id="horse">
      <!-- long straight legs: the thing that says horse rather than dog -->
      <g fill="none" stroke-width="7" stroke-linecap="round">
        <path d="M78 42 L92 68 L100 90"/>
        <path d="M68 44 L62 70 L72 90"/>
        <path d="M26 44 L10 68 L20 90"/>
        <path d="M34 44 L44 68 L36 90"/>
      </g>
      <!-- barrel, rump, chest -->
      <ellipse cx="50" cy="24" rx="34" ry="20"/>
      <circle cx="24" cy="22" r="22"/>
      <circle cx="74" cy="26" r="20"/>
      <!-- the long neck and the long head on the end of it -->
      <path d="M64 12 L80 -26 L96 -42 L128 -38 L130 -26 L104 -18 L92 8 Z"/>
      <path d="M98 -44 L100 -57 L109 -45 Z"/>
      <!-- tail -->
      <path d="M10 4 Q-14 2 -22 30 L-10 34 Q-4 16 12 16 Z"/>
      <!-- the jockey, outlined in the background colour so he reads apart from the horse -->
      <g stroke="#eef0f5" stroke-width="3">
        <path d="M20 2 Q32 -28 56 -18 L62 -4 Q40 6 20 2 Z"/>
        <circle cx="64" cy="-26" r="11"/>
        <path d="M56 -14 L82 -6 L78 2 L54 -6 Z"/>
        <path d="M38 -2 L50 -2 L46 22 L52 32 L40 32 L34 20 Z"/>
      </g>
    </g>
  </defs>
  <!-- the two lanes of the track -->
  <g stroke="#9aa2b4" stroke-width="3" stroke-dasharray="14 12">
    <path d="M0 138 L320 138"/>
    <path d="M0 200 L320 200"/>
  </g>
  <!-- the field, bunched up and every one of them the same pale colour -->
  <g fill="#9aa2b4" stroke="#9aa2b4">
    <g transform="translate(20,88) scale(0.55)"><use href="#horse"/></g>
    <g transform="translate(66,88) scale(0.55)"><use href="#horse"/></g>
    <g transform="translate(112,88) scale(0.55)"><use href="#horse"/></g>
  </g>
  <!-- the surge nobody had backed -->
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round">
    <path d="M96 150 L134 150"/>
    <path d="M88 168 L124 168"/>
    <path d="M98 186 L132 186"/>
  </g>
  <!-- the dark horse, past the field and in front -->
  <g fill="#4f46e5" stroke="#4f46e5">
    <g transform="translate(168,123) scale(0.85)"><use href="#horse"/></g>
  </g>
</svg>
