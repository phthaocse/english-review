<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Someone shoving a crate hard to the right while the result loops overhead and ends up pointing back the other way">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- ground -->
  <path d="M8 212 L312 212" stroke="#9aa2b4" stroke-width="5" stroke-linecap="round"/>
  <!-- where the effort was meant to get to -->
  <g stroke="#9aa2b4" stroke-width="5" fill="none" stroke-dasharray="12 10" stroke-linecap="round">
    <path d="M204 182 L286 182"/>
  </g>
  <path d="M278 170 L296 182 L278 194 Z" fill="#9aa2b4"/>
  <!-- the crate being shoved -->
  <rect x="134" y="150" width="62" height="62" rx="4" fill="#9aa2b4" stroke="#7b8399" stroke-width="5"/>
  <!-- the person doing the shoving -->
  <g stroke="#4f46e5" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M86 156 L86 184"/>
    <path d="M86 184 L72 212"/><path d="M86 184 L102 212"/>
    <path d="M86 160 L130 168"/>
  </g>
  <circle cx="86" cy="140" r="15" fill="#4f46e5"/>
  <!-- what actually came of it: the result swings overhead and lands behind the start -->
  <path d="M190 142 C226 56, 96 20, 40 68" stroke="#c0392f" stroke-width="9"
        fill="none" stroke-linecap="round"/>
  <path d="M52 56 L30 78 L58 88 Z" fill="#c0392f"/>
</svg>
