<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A past question built from the word did followed by the plain verb and a question mark, with a separate -ed ending struck through in red below it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the question frame holding the correct pattern -->
  <rect x="18" y="40" width="284" height="96" rx="16" fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <!-- did carries the past tense, so it is the filled block -->
  <rect x="36" y="58" width="92" height="60" rx="10" fill="#4f46e5"/>
  <text x="82" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">Did</text>
  <!-- the verb stays bare, so it is the open block -->
  <rect x="140" y="58" width="84" height="60" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="4"/>
  <text x="182" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#4f46e5">go</text>
  <text x="262" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#4f46e5">?</text>
  <!-- tick under the bare verb -->
  <path d="M60 180 l18 20 l36 -46" fill="none" stroke="#2f6b4f" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the ending that must not be added as well, struck through -->
  <rect x="176" y="156" width="118" height="58" rx="10" fill="#ffffff" stroke="#c0392f" stroke-width="4"/>
  <text x="235" y="196" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="32" font-weight="700" fill="#c0392f">-ed</text>
  <path d="M186 202 L284 168" stroke="#c0392f" stroke-width="7" stroke-linecap="round"/>
</svg>
