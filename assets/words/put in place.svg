<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two gears sitting either side of an empty dashed outline, and the gear that fits that outline coming down into it on an arrow so the three will mesh">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the gear that is on its way in -->
  <g transform="translate(158,54)" fill="#4f46e5">
    <rect x="-7" y="-46" width="14" height="18"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(45)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(90)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(135)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(180)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(225)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(270)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(315)"/>
    <circle r="34"/>
    <circle r="10" fill="#eef0f5"/>
  </g>
  <!-- and where it is going -->
  <path d="M158 104 L158 118" stroke="#4f46e5" stroke-width="5" stroke-dasharray="6 7"/>
  <polygon points="158,126 148,110 168,110" fill="#4f46e5"/>
  <circle cx="158" cy="168" r="34" fill="none" stroke="#9aa2b4" stroke-width="3" stroke-dasharray="9 8"/>
  <!-- the two that are already turning, waiting on the third -->
  <g transform="translate(78,168)" fill="#9aa2b4">
    <rect x="-7" y="-46" width="14" height="18"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(45)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(90)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(135)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(180)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(225)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(270)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(315)"/>
    <circle r="34"/>
    <circle r="10" fill="#eef0f5"/>
  </g>
  <g transform="translate(238,168)" fill="#9aa2b4">
    <rect x="-7" y="-46" width="14" height="18"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(45)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(90)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(135)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(180)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(225)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(270)"/>
    <rect x="-7" y="-46" width="14" height="18" transform="rotate(315)"/>
    <circle r="34"/>
    <circle r="10" fill="#eef0f5"/>
  </g>
</svg>
