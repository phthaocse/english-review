<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A crossroads seen from above with every lane packed bumper to bumper and vehicles stuck inside the junction itself">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the two roads and the junction they share -->
  <g fill="#7b8399">
    <rect x="0" y="92" width="320" height="64"/>
    <rect x="128" y="0" width="64" height="240"/>
  </g>
  <!-- lane markings, only outside the junction -->
  <g stroke="#eef0f5" stroke-width="3" stroke-dasharray="12 10" opacity=".8">
    <path d="M0 124 L128 124"/><path d="M192 124 L320 124"/>
    <path d="M160 0 L160 92"/><path d="M160 156 L160 240"/>
  </g>
  <!-- traffic crawling east and west, nose to tail -->
  <g fill="#4f46e5">
    <rect x="2" y="100" width="26" height="20" rx="4"/>
    <rect x="32" y="100" width="26" height="20" rx="4"/>
    <rect x="62" y="100" width="26" height="20" rx="4"/>
    <rect x="92" y="100" width="26" height="20" rx="4"/>
    <rect x="196" y="100" width="26" height="20" rx="4"/>
    <rect x="256" y="100" width="26" height="20" rx="4"/>
    <rect x="6" y="130" width="26" height="20" rx="4"/>
    <rect x="66" y="130" width="26" height="20" rx="4"/>
    <rect x="96" y="130" width="26" height="20" rx="4"/>
    <rect x="224" y="130" width="26" height="20" rx="4"/>
    <rect x="254" y="130" width="26" height="20" rx="4"/>
    <rect x="284" y="130" width="26" height="20" rx="4"/>
  </g>
  <g fill="#c0392f">
    <rect x="226" y="100" width="26" height="20" rx="4"/>
    <rect x="286" y="100" width="26" height="20" rx="4"/>
    <rect x="36" y="130" width="26" height="20" rx="4"/>
    <rect x="194" y="130" width="26" height="20" rx="4"/>
  </g>
  <!-- traffic crawling north and south -->
  <g fill="#4f46e5">
    <rect x="136" y="0" width="20" height="26" rx="4"/>
    <rect x="136" y="30" width="20" height="26" rx="4"/>
    <rect x="136" y="60" width="20" height="26" rx="4"/>
    <rect x="136" y="160" width="20" height="26" rx="4"/>
    <rect x="136" y="190" width="20" height="26" rx="4"/>
    <rect x="168" y="8" width="20" height="26" rx="4"/>
    <rect x="168" y="38" width="20" height="26" rx="4"/>
    <rect x="168" y="162" width="20" height="26" rx="4"/>
    <rect x="168" y="192" width="20" height="26" rx="4"/>
  </g>
  <g fill="#c0392f">
    <rect x="136" y="220" width="20" height="26" rx="4"/>
    <rect x="168" y="68" width="20" height="26" rx="4"/>
  </g>
  <!-- the two that have blocked the box, so nothing anywhere can move -->
  <g fill="#c0392f">
    <rect x="158" y="100" width="26" height="20" rx="4"/>
  </g>
  <g fill="#4f46e5">
    <rect x="136" y="126" width="20" height="26" rx="4"/>
  </g>
</svg>
