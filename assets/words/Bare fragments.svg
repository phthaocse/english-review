<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two sentence bars built from blocks: the upper bar has its middle verb block in place and is ticked, the lower bar has a red dashed hole where that block should be and is crossed out">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the sentence that stands up: something, a main verb, then the rest -->
  <g>
    <rect x="22" y="50" width="62" height="50" rx="8" fill="#9aa2b4"/>
    <rect x="92" y="50" width="94" height="50" rx="8" fill="#4f46e5"/>
    <rect x="194" y="50" width="56" height="50" rx="8" fill="#9aa2b4"/>
    <text x="139" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
          font-size="23" font-weight="700" fill="#ffffff">verb</text>
  </g>
  <!-- ticked, because the main verb is there -->
  <path d="M264 78 L275 90 L300 58" fill="none" stroke="#2f6b4f" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the same bar with the verb block taken out: a hole nothing fills -->
  <g>
    <rect x="22" y="146" width="62" height="50" rx="8" fill="#9aa2b4"/>
    <rect x="92" y="146" width="94" height="50" rx="8" fill="none" stroke="#c0392f"
          stroke-width="6" stroke-dasharray="12 10"/>
    <rect x="194" y="146" width="56" height="50" rx="8" fill="#9aa2b4"/>
  </g>
  <!-- crossed out, because no block here can be read as the main verb -->
  <g stroke="#c0392f" stroke-width="10" stroke-linecap="round">
    <path d="M268 156 L298 186"/><path d="M298 156 L268 186"/>
  </g>
</svg>
