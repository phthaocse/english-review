<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A speaker whose speech bubble is outlined in a broken dashed line rather than a firm one, its last line of content fading out into a wobble">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the speaker, saying it -->
  <circle cx="56" cy="180" r="25" fill="#9aa2b4"/>
  <path d="M20 232 Q22 202 56 202 Q90 202 92 232 Z" fill="#9aa2b4"/>
  <!-- the bubble, drawn with a soft broken edge: the claim is offered, not asserted -->
  <path d="M120 32 H272 Q296 32 296 56 V128 Q296 152 272 152 H166 L122 192 L134 152 H120 Q96 152 96 128 V56 Q96 32 120 32 Z"
        fill="#ffffff" stroke="#4f46e5" stroke-width="6" stroke-dasharray="13 11" stroke-linejoin="round"/>
  <!-- what is being said: firm at the start, trailing off at the end -->
  <g fill="#7b8399">
    <rect x="124" y="62" width="142" height="13" rx="4"/>
    <rect x="124" y="90" width="112" height="13" rx="4"/>
  </g>
  <rect x="124" y="118" width="54" height="13" rx="4" fill="#9aa2b4"/>
  <path d="M192 128 q9 -11 18 0 q9 11 18 0" fill="none" stroke="#c0392f" stroke-width="5" stroke-linecap="round"/>
</svg>
