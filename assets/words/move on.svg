<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person stepping out through an open door carrying a bag, leaving behind a tidy empty desk with the chair pushed in">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the room being left, and its floor -->
  <rect x="10" y="26" width="196" height="196" fill="#ffffff" stroke="#9aa2b4" stroke-width="3"/>
  <path d="M10 162 H206" stroke="#9aa2b4" stroke-width="3"/>
  <!-- the desk, cleared: nothing left on it -->
  <rect x="40" y="132" width="116" height="12" rx="4" fill="#9aa2b4"/>
  <rect x="46" y="144" width="10" height="46" fill="#9aa2b4"/>
  <rect x="140" y="144" width="10" height="46" fill="#9aa2b4"/>
  <!-- the chair pushed back in under it -->
  <rect x="76" y="100" width="12" height="46" rx="4" fill="#7b8399"/>
  <rect x="70" y="146" width="48" height="10" rx="4" fill="#7b8399"/>
  <rect x="74" y="156" width="8" height="34" fill="#7b8399"/>
  <rect x="106" y="156" width="8" height="34" fill="#7b8399"/>
  <!-- the open doorway out -->
  <rect x="206" y="30" width="100" height="192" fill="#eef0f5" stroke="#7b8399" stroke-width="6"/>
  <path d="M206 30 L172 44 L172 208 L206 222" fill="#ffffff" stroke="#7b8399" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="182" cy="128" r="6" fill="#7b8399"/>
  <!-- the person walking out, mid-stride, with their bag -->
  <g fill="#4f46e5">
    <circle cx="250" cy="76" r="20"/>
    <path d="M232 100 h36 l10 62 h-56 z"/>
  </g>
  <g stroke="#4f46e5" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M240 160 L224 208"/>
    <path d="M258 160 L286 200"/>
    <path d="M266 112 L288 142"/>
  </g>
  <rect x="274" y="146" width="40" height="34" rx="5" fill="#7b8399"/>
  <path d="M286 146 v-10 h16 v10" fill="none" stroke="#7b8399" stroke-width="5"/>
</svg>
