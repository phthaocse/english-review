<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A shelf of five jars and boxes with an arm stretched right across the near ones, its hand closing on the single one that carries a target mark">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- everything that was on offer -->
  <g fill="#9aa2b4">
    <rect x="30" y="118" width="44" height="64" rx="4"/>
    <rect x="86" y="104" width="36" height="78" rx="17"/>
    <rect x="134" y="124" width="46" height="58" rx="4"/>
    <rect x="258" y="132" width="40" height="50" rx="4"/>
  </g>
  <!-- the one that was actually wanted -->
  <rect x="194" y="114" width="52" height="68" rx="6" fill="#4f46e5"/>
  <circle cx="220" cy="158" r="16" fill="#c0392f"/>
  <circle cx="220" cy="158" r="10" fill="#ffffff"/>
  <circle cx="220" cy="158" r="4" fill="#c0392f"/>
  <!-- the shelf they stand on -->
  <g fill="#7b8399">
    <rect x="12" y="182" width="296" height="14" rx="3"/>
    <rect x="28" y="196" width="12" height="30"/>
    <rect x="280" y="196" width="12" height="30"/>
  </g>
  <!-- the arm going straight past all the rest of them -->
  <polygon points="0,48 0,110 58,102 52,58" fill="#7b8399"/>
  <path d="M50 80 C 100 86, 146 94, 188 100" fill="none" stroke="#9aa2b4"
        stroke-width="26" stroke-linecap="round"/>
  <g fill="#9aa2b4">
    <rect x="182" y="80" width="56" height="38" rx="14"/>
    <rect x="192" y="112" width="13" height="26" rx="6"/>
    <rect x="210" y="112" width="13" height="26" rx="6"/>
    <rect x="228" y="112" width="13" height="26" rx="6"/>
    <rect x="174" y="102" width="13" height="26" rx="6"/>
  </g>
</svg>
