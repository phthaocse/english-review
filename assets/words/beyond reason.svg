<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A neat straight line measured along a ruler which then runs past the end of the ruler and breaks into a wild zigzag flying off the page">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ruler: as far as measuring can go -->
  <rect x="18" y="140" width="182" height="44" rx="4" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
  <g stroke="#7b8399" stroke-width="3">
    <path d="M40 140 L40 160"/><path d="M62 140 L62 152"/><path d="M84 140 L84 160"/>
    <path d="M106 140 L106 152"/><path d="M128 140 L128 160"/><path d="M150 140 L150 152"/>
    <path d="M172 140 L172 160"/><path d="M194 140 L194 152"/>
  </g>
  <!-- the end of the ruler: the last point at which anything can be judged -->
  <path d="M202 52 L202 200" stroke="#c0392f" stroke-width="3" stroke-dasharray="8 7"/>
  <!-- the sensible part of the line, straight and on the scale -->
  <path d="M28 114 L200 114" stroke="#4f46e5" stroke-width="10" stroke-linecap="round"/>
  <!-- past the ruler it has nothing left to follow and goes wild -->
  <path d="M200 114 L224 62 L244 176 L268 46 L288 182 L318 30" fill="none"
        stroke="#c0392f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
