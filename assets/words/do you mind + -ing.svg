<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="The verb mind with two following slots, the -ing slot ticked in green and the to-infinitive slot crossed out in red">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the verb that does the choosing -->
  <rect x="14" y="92" width="112" height="60" rx="10" fill="#4f46e5"/>
  <text x="70" y="134" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff">mind</text>
  <!-- the two branches leaving it -->
  <g stroke="#9aa2b4" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M126 112 C148 112, 144 70, 164 70"/>
    <path d="M126 132 C148 132, 144 174, 164 174"/>
  </g>
  <!-- the branch English takes -->
  <rect x="164" y="40" width="104" height="60" rx="10" fill="#ffffff" stroke="#2f6b4f" stroke-width="4"/>
  <text x="216" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#2f6b4f">-ing</text>
  <path d="M280 68 l10 12 l22 -28" fill="none" stroke="#2f6b4f" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the branch it does not take -->
  <rect x="164" y="144" width="104" height="60" rx="10" fill="#ffffff" stroke="#c0392f" stroke-width="4"/>
  <text x="216" y="186" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="28" font-weight="700" fill="#c0392f">to go</text>
  <g stroke="#c0392f" stroke-width="9" stroke-linecap="round">
    <path d="M280 160 L310 190"/><path d="M310 160 L280 190"/>
  </g>
</svg>
