<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person kneeling to water one small plant, with a long receding row of watering cans behind them showing they have come and done it every day">
  <rect width="320" height="240" fill="#eef0f5"/>
  <defs>
    <!-- one watering can, reused for every day that came before -->
    <g id="can">
      <path d="M0 0 h44 v32 q0 8 -8 8 h-28 q-8 0 -8 -8 z"/>
      <path d="M44 6 L72 22 L66 32 L44 20 Z"/>
      <path d="M8 0 Q22 -18 36 0" fill="none" stroke-width="7"/>
    </g>
  </defs>
  <!-- all the earlier days: the same small task, repeated until it runs out of sight -->
  <g fill="#9aa2b4" stroke="#9aa2b4">
    <g opacity="0.85"><use href="#can" transform="translate(88 26) scale(0.62)"/></g>
    <g opacity="0.7"><use href="#can" transform="translate(140 32) scale(0.5)"/></g>
    <g opacity="0.55"><use href="#can" transform="translate(182 37) scale(0.4)"/></g>
    <g opacity="0.42"><use href="#can" transform="translate(216 41) scale(0.32)"/></g>
    <g opacity="0.3"><use href="#can" transform="translate(244 44) scale(0.26)"/></g>
    <g opacity="0.22"><use href="#can" transform="translate(266 47) scale(0.2)"/></g>
  </g>
  <!-- the person, down on one knee to reach the plant -->
  <circle cx="70" cy="100" r="23" fill="#4f46e5"/>
  <rect x="48" y="112" width="46" height="70" rx="20" fill="#4f46e5" transform="rotate(16 71 147)"/>
  <rect x="42" y="172" width="38" height="46" rx="18" fill="#4f46e5"/>
  <rect x="64" y="192" width="76" height="28" rx="14" fill="#4f46e5"/>
  <rect x="90" y="126" width="68" height="20" rx="10" fill="#4f46e5" transform="rotate(12 124 136)"/>
  <!-- today's can, tipped over so the water comes out -->
  <g fill="#4f46e5">
    <path d="M148 130 h48 v36 q0 9 -9 9 h-30 q-9 0 -9 -9 z"/>
    <path d="M196 136 L228 154 L221 166 L196 152 Z"/>
  </g>
  <path d="M156 130 Q172 110 188 130" fill="none" stroke="#4f46e5" stroke-width="7"/>
  <!-- the water going in, one more time -->
  <g stroke="#6f68ea" stroke-width="7" stroke-linecap="round">
    <path d="M222 172 L214 188"/><path d="M231 172 L223 188"/><path d="M213 176 L206 190"/>
  </g>
  <!-- the one small plant it is all for -->
  <path d="M202 198 H250 L243 222 H209 Z" fill="#c9a227"/>
  <path d="M226 198 V160" stroke="#2f6b4f" stroke-width="7" stroke-linecap="round"/>
  <path d="M226 174 Q202 164 199 142 Q224 144 226 174 Z" fill="#2f6b4f"/>
  <path d="M226 182 Q250 172 254 152 Q230 150 226 182 Z" fill="#2f6b4f"/>
  <!-- the ground it all stands on -->
  <path d="M0 222 H320" stroke="#7b8399" stroke-width="6"/>
</svg>
