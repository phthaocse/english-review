<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A balance that everyone expected to go down on the right, shown ghosted in grey, has in fact settled slightly down on the left instead">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the way it was expected to tip, drawn as a ghost -->
  <g fill="none" stroke="#9aa2b4" stroke-width="6" stroke-linecap="round" stroke-dasharray="9 8">
    <path d="M82 74 L238 118"/>
    <path d="M82 74 L82 96"/><path d="M238 118 L238 140"/>
    <path d="M64 96 L100 96 L94 110 L70 110 Z"/>
    <path d="M220 140 L256 140 L250 154 L226 154 Z"/>
  </g>
  <!-- the stand it swings on -->
  <rect x="155" y="94" width="10" height="114" fill="#7b8399"/>
  <path d="M118 210 L202 210 L186 196 L134 196 Z" fill="#7b8399"/>
  <path d="M8 212 L312 212" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- what actually happened: it has come down a little on the other side -->
  <g stroke="#4f46e5" stroke-width="9" stroke-linecap="round">
    <path d="M80 104 L240 90"/>
    <path d="M80 104 L80 126"/><path d="M240 90 L240 112"/>
  </g>
  <g fill="#4f46e5">
    <path d="M62 126 L98 126 L92 142 L68 142 Z"/>
    <path d="M222 112 L258 112 L252 128 L228 128 Z"/>
  </g>
  <!-- the small move that went the other way -->
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M34 92 L34 126"/><path d="M25 116 L34 130 L43 116"/>
  </g>
</svg>
