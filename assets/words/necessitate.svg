<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One domino toppling over onto the next, which is ringed in red and picked out by a red arrow as the thing that must now happen">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the arrow singling out what the first one forces -->
  <path d="M212 40 L212 74" stroke="#c0392f" stroke-width="7" stroke-linecap="round"/>
  <polygon points="198,72 226,72 212,94" fill="#c0392f"/>
  <!-- the ground they stand on -->
  <path d="M14 202 L306 202" stroke="#7b8399" stroke-width="5"/>
  <!-- the arc the first one swung through as it fell -->
  <path d="M96 92 Q142 96 172 128" fill="none" stroke="#9aa2b4" stroke-width="4" stroke-dasharray="8 8" stroke-linecap="round"/>
  <!-- the first domino, already over and pushing -->
  <g transform="rotate(54 96 202)">
    <rect x="74" y="94" width="44" height="108" rx="5" fill="#4f46e5"/>
    <rect x="80" y="146" width="32" height="5" rx="2" fill="#ffffff"/>
    <circle cx="96" cy="122" r="6" fill="#ffffff"/>
    <circle cx="88" cy="176" r="5" fill="#ffffff"/>
    <circle cx="104" cy="176" r="5" fill="#ffffff"/>
  </g>
  <!-- the second, already tipping: it has no choice now -->
  <g transform="rotate(9 190 202)">
    <rect x="190" y="98" width="46" height="104" rx="5" fill="#ffffff" stroke="#c0392f" stroke-width="6"/>
    <rect x="198" y="148" width="30" height="5" rx="2" fill="#c0392f"/>
    <circle cx="206" cy="124" r="5" fill="#c0392f"/>
    <circle cx="220" cy="124" r="5" fill="#c0392f"/>
    <circle cx="213" cy="176" r="6" fill="#c0392f"/>
  </g>
</svg>
