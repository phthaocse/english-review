<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person standing at the bottom of an enormous cliff wall that runs off the top of the picture, looking all the way up it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the cliff: one unbroken wall, its top almost at the frame edge -->
  <path d="M116 216 L124 58 L140 24 L168 12 L320 12 L320 216 Z" fill="#9aa2b4"/>
  <!-- the near face, in shadow, so the wall has an edge and a depth -->
  <path d="M116 216 L124 58 L140 24 L168 12 L196 12 L180 216 Z" fill="#7b8399"/>
  <!-- cracks running the full height, which is what makes the height legible -->
  <g stroke="#7b8399" stroke-width="3" fill="none" opacity=".8">
    <path d="M150 22 V216"/> <path d="M184 14 V216"/> <path d="M218 14 V216"/> <path d="M252 14 V216"/> <path d="M286 14 V216"/>
  </g>
  <!-- the ground, shared by the wall and the person -->
  <path d="M0 216 H320" stroke="#7b8399" stroke-width="4"/>
  <!-- the person, right at the foot of it, head tipped back -->
  <g fill="#4f46e5">
    <circle cx="80" cy="182" r="12"/>
    <path d="M67 216 L69 197 Q80 190 91 197 L93 216 Z"/>
  </g>
  <!-- what they are looking at -->
  <g fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="8 7">
    <path d="M92 174 L152 26"/>
  </g>
  <path d="M158 12 L142 30 L164 34 Z" fill="#4f46e5"/>
</svg>
