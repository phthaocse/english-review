<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A wide arrow feeding into a machine and an almost equally wide arrow coming out, with only a thin wisp escaping as waste">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- what is lost on the way, kept deliberately thin -->
  <g stroke="#c0392f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M142 74 q -10 -14 0 -26 q 10 -12 0 -24"/>
    <path d="M178 74 q -10 -14 0 -26 q 10 -12 0 -24"/>
  </g>
  <!-- the machine the work passes through -->
  <rect x="110" y="78" width="100" height="94" rx="8" fill="#9aa2b4" stroke="#7b8399" stroke-width="6"/>
  <circle cx="160" cy="125" r="24" fill="none" stroke="#7b8399" stroke-width="7"/>
  <circle cx="160" cy="125" r="7" fill="#7b8399"/>
  <!-- what goes in -->
  <path d="M6 96 L70 96 L70 78 L112 125 L70 172 L70 154 L6 154 Z" fill="#4f46e5"/>
  <!-- what comes out: narrower, but only just -->
  <path d="M208 104 L258 104 L258 90 L300 125 L258 160 L258 146 L208 146 Z" fill="#4f46e5"/>
</svg>
