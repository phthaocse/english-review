<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A figure walking away from a raised platform it has left empty, down onto the ground">
  <rect width="320" height="240" fill="#eef0f5"/>

  <!-- the position, on the right, now empty: the tallest block with nobody on it -->
  <g fill="#9aa2b4">
    <rect x="246" y="96" width="60" height="104"/>
    <rect x="200" y="132" width="52" height="68"/>
    <rect x="158" y="166" width="48" height="34"/>
  </g>
  <rect x="246" y="96" width="60" height="9" fill="#7b8399"/>
  <!-- the vacancy said plainly: a dashed outline where someone used to stand -->
  <g stroke="#7b8399" stroke-width="2.5" stroke-dasharray="6 5" fill="none" opacity=".85">
    <circle cx="276" cy="66" r="11"/>
    <path d="M276 78 V92"/>
  </g>

  <rect y="200" width="320" height="6" fill="#7b8399"/>

  <!-- the figure, on the ground and walking AWAY - the back is to the steps,
       which is what stops this reading as someone climbing -->
  <g fill="none" stroke="#4f46e5" stroke-width="8" stroke-linecap="round">
    <path d="M96 200 L84 168"/>
    <path d="M96 200 L112 172"/>
    <path d="M100 168 V126"/>
    <path d="M100 138 L74 150"/>
    <path d="M100 138 L124 128"/>
  </g>
  <circle cx="100" cy="112" r="14" fill="#4f46e5"/>

  <!-- the descent, from the empty place down to the ground -->
  <path d="M254 82 Q186 78 140 176" stroke="#c0392f" stroke-width="5" fill="none"
        stroke-linecap="round" marker-end="url(#d)"/>

  <defs>
    <marker id="d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392f"/></marker>
  </defs>
</svg>
