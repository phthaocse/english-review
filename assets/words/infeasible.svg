<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A path running straight into a sheer wall that carries a large red cross, with a small figure halted in front of it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the path, going somewhere right up until it does not -->
  <rect x="0" y="194" width="228" height="20" fill="#9aa2b4"/>
  <path d="M0 204 L212 204" stroke="#eef0f5" stroke-width="5" stroke-dasharray="20 18"/>
  <!-- the wall: full height, no way over and no way round -->
  <rect x="228" y="8" width="70" height="206" fill="#7b8399"/>
  <g stroke="#9aa2b4" stroke-width="3">
    <path d="M228 48 L298 48"/><path d="M228 88 L298 88"/><path d="M228 128 L298 128"/>
    <path d="M228 168 L298 168"/>
    <path d="M263 8 L263 48"/><path d="M263 88 L263 128"/><path d="M263 168 L263 214"/>
  </g>
  <!-- the answer written across it -->
  <g stroke="#c0392f" stroke-width="15" stroke-linecap="round">
    <path d="M238 78 L288 142"/><path d="M288 78 L238 142"/>
  </g>
  <!-- whoever was walking, stopped short -->
  <g stroke="#4f46e5" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M132 126 L134 162"/>
    <path d="M134 162 L122 194"/>
    <path d="M134 162 L148 194"/>
    <path d="M132 134 L150 146"/>
  </g>
  <circle cx="131" cy="108" r="15" fill="#4f46e5"/>
</svg>
