<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One building under a single roof divided by thick walls into four sealed units, each occupied by a different colour">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- one roof over the lot: it is a single building -->
  <path d="M20 76 L160 20 L300 76 Z" fill="#7b8399"/>
  <!-- four separate occupiers, none of them sharing space with another -->
  <rect x="44" y="82" width="110" height="62" fill="#4f46e5" opacity=".8"/>
  <rect x="166" y="82" width="110" height="62" fill="#e0b73a"/>
  <rect x="44" y="156" width="110" height="62" fill="#2f6b4f" opacity=".85"/>
  <rect x="166" y="156" width="110" height="62" fill="#c0392f" opacity=".8"/>
  <!-- a window each, so it reads as four homes and not four boxes -->
  <g fill="#eef0f5" opacity=".7">
    <rect x="86" y="102" width="26" height="22"/>
    <rect x="208" y="102" width="26" height="22"/>
    <rect x="86" y="176" width="26" height="22"/>
    <rect x="208" y="176" width="26" height="22"/>
  </g>
  <!-- the solid walls between them: nothing leaks from one unit into the next -->
  <g fill="#7b8399">
    <rect x="154" y="76" width="12" height="148"/>
    <rect x="32" y="144" width="256" height="12"/>
    <rect x="32" y="76" width="12" height="148"/>
    <rect x="276" y="76" width="12" height="148"/>
    <rect x="32" y="76" width="256" height="8"/>
    <rect x="32" y="216" width="256" height="8"/>
  </g>
</svg>
