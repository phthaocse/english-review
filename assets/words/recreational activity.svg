<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two people throwing a ball to each other on the grass beside a park bench, with a clock reading five o'clock">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the park they are in -->
  <rect x="0" y="206" width="320" height="34" fill="#2f6b4f" opacity=".35"/>
  <!-- the bench nobody is sitting on -->
  <g fill="#7b8399">
    <rect x="16" y="168" width="94" height="10" rx="3"/>
    <rect x="16" y="146" width="94" height="9" rx="3"/>
    <rect x="24" y="146" width="9" height="60"/>
    <rect x="93" y="146" width="9" height="60"/>
  </g>
  <!-- the clock: the working part of the day is over -->
  <circle cx="54" cy="58" r="33" fill="#eef0f5" stroke="#7b8399" stroke-width="5"/>
  <g stroke="#7b8399" stroke-width="3" stroke-linecap="round">
    <path d="M54 31 V37"/><path d="M54 85 V79"/><path d="M27 58 H33"/><path d="M81 58 H75"/>
  </g>
  <g stroke="#4f46e5" stroke-linecap="round" fill="none">
    <path d="M54 58 L54 36" stroke-width="5"/>
    <path d="M54 58 L70 76" stroke-width="6"/>
  </g>
  <circle cx="54" cy="58" r="4" fill="#4f46e5"/>
  <!-- the two of them, playing -->
  <g fill="#4f46e5" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="176" cy="120" r="15" stroke="none"/>
    <path d="M176 136 L176 176"/>
    <path d="M176 176 L161 208"/><path d="M176 176 L191 208"/>
    <path d="M176 146 L198 128"/><path d="M176 146 L156 134"/>
    <circle cx="278" cy="120" r="15" stroke="none"/>
    <path d="M278 136 L278 176"/>
    <path d="M278 176 L263 208"/><path d="M278 176 L293 208"/>
    <path d="M278 146 L256 128"/><path d="M278 146 L298 134"/>
  </g>
  <!-- the ball, and the arc it is travelling on -->
  <path d="M196 124 Q226 82 258 124" fill="none" stroke="#7b8399" stroke-width="2.5" stroke-dasharray="7 6"/>
  <circle cx="227" cy="96" r="16" fill="#e0b73a" stroke="#c9a227" stroke-width="3"/>
</svg>
