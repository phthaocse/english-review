<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person gives a reason out loud in a speech bubble while behind their back a hand keeps a written red note out of sight, only its far corner showing past their side">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the real motive, written down and held round the back where it will not be seen -->
  <g transform="rotate(-13 133 175)">
    <rect x="70" y="144" width="126" height="62" rx="5" fill="#c0392f"/>
    <g stroke="#8f2a22" stroke-width="6" stroke-linecap="round">
      <path d="M86 162 H180"/><path d="M86 178 H180"/><path d="M86 194 H154"/>
    </g>
  </g>
  <!-- the hand keeping it there -->
  <circle cx="146" cy="150" r="15" fill="#4f46e5"/>
  <!-- the person, standing squarely between you and the note -->
  <circle cx="98" cy="86" r="27" fill="#4f46e5"/>
  <path d="M54 228 Q54 126 98 122 Q142 126 142 228 Z" fill="#4f46e5"/>
  <!-- the reason they give out loud, which is not the one on the note -->
  <polygon points="176 90 142 116 192 94" fill="#ffffff" stroke="#9aa2b4" stroke-width="4"/>
  <rect x="168" y="18" width="140" height="74" rx="16" fill="#ffffff" stroke="#9aa2b4" stroke-width="4"/>
  <g stroke="#9aa2b4" stroke-width="7" stroke-linecap="round">
    <path d="M186 40 H290"/><path d="M186 56 H290"/><path d="M186 72 H254"/>
  </g>
  <polygon points="176 90 148 112 190 94" fill="#ffffff"/>
</svg>
