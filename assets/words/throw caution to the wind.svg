<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A figure striding off the hazard-marked lip of a ledge into open air while the helmet they were wearing tumbles away on the wind">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ledge, and the drop where it stops -->
  <rect x="0" y="178" width="152" height="62" fill="#7b8399"/>
  <rect x="0" y="178" width="152" height="10" fill="#9aa2b4"/>
  <!-- the warning band along the lip, which is being walked over -->
  <rect x="104" y="166" width="48" height="13" fill="#ffffff" stroke="#c0392f" stroke-width="3"/>
  <g fill="#c0392f">
    <polygon points="108,166 118,166 110,179 100,179"/>
    <polygon points="124,166 134,166 126,179 116,179"/>
    <polygon points="140,166 150,166 142,179 132,179"/>
  </g>
  <!-- the wind carrying it off -->
  <g fill="none" stroke="#9aa2b4" stroke-width="5" stroke-linecap="round">
    <path d="M196 104 q28 -10 54 -2"/>
    <path d="M208 126 q26 -10 50 -2"/>
    <path d="M190 146 q20 -8 42 -2"/>
  </g>
  <!-- the helmet, already gone -->
  <g transform="translate(256,48) rotate(34)">
    <path d="M-27 8 A27 23 0 0 1 27 8 Z" fill="#e0b73a" stroke="#a8841c" stroke-width="3"/>
    <rect x="-31" y="6" width="62" height="10" rx="5" fill="#c9a227"/>
  </g>
  <!-- the arc it took off their head -->
  <path d="M160 74 Q204 38 230 42" fill="none" stroke="#9aa2b4" stroke-width="4" stroke-dasharray="7 8" stroke-linecap="round"/>
  <!-- them, stepping out over nothing with both arms up -->
  <g stroke="#4f46e5" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M140 104 L148 148"/>
    <path d="M148 148 L124 174"/>
    <path d="M148 148 L186 180"/>
    <path d="M142 114 L104 84"/>
    <path d="M142 114 L178 82"/>
  </g>
  <circle cx="138" cy="86" r="16" fill="#4f46e5"/>
</svg>
