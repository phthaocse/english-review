<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A tall smooth bar on the left, a thick red arrow driving down into a second bar on the right which is left much shorter, jagged along the top and cracked"
     >
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground both bars stand on -->
  <path d="M18 208 H302" stroke="#7b8399" stroke-width="5" stroke-linecap="round"/>
  <!-- how it stood before -->
  <rect x="34" y="52" width="74" height="156" rx="3" fill="#4f46e5"/>
  <!-- what was done to it -->
  <path d="M126 40 L206 92" fill="none" stroke="#c0392f" stroke-width="12" stroke-linecap="round"/>
  <polygon points="224,104 201,102 213,84" fill="#c0392f"/>
  <!-- how it stands after: shorter, and the top left broken -->
  <path d="M218 126 L232 118 L246 130 L260 116 L274 130 L292 120 L292 208 L218 208 Z" fill="#8b85ee"/>
  <path d="M246 140 L254 162 L242 180 L252 206" fill="none" stroke="#eef0f5" stroke-width="5" stroke-linecap="round"/>
</svg>
