<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A figure marching dead straight behind one red banner with its gaze fixed ahead, walking past the side paths branching away on either hand">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the side turnings, none of which get taken -->
  <g fill="none" stroke="#9aa2b4" stroke-width="5" stroke-dasharray="11 9" stroke-linecap="round">
    <path d="M204 212 Q256 206 304 168"/>
    <path d="M204 212 Q252 222 300 238"/>
  </g>
  <!-- the one line being walked -->
  <path d="M0 212 L320 212" stroke="#7b8399" stroke-width="6"/>
  <!-- the banner, the only thing being carried -->
  <path d="M108 32 L130 208" stroke="#7b8399" stroke-width="7" stroke-linecap="round"/>
  <path d="M108 34 L30 46 L48 68 L30 90 L112 76 Z" fill="#c0392f"/>
  <!-- the fixed line of sight, running clean off the edge of the picture -->
  <g stroke="#9aa2b4" stroke-width="4" stroke-dasharray="11 9" stroke-linecap="round">
    <path d="M178 90 L296 90"/>
  </g>
  <polygon points="292,78 316,90 292,102" fill="#9aa2b4"/>
  <!-- them, marching -->
  <g stroke="#4f46e5" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M160 108 L158 154"/>
    <path d="M158 154 L136 212"/>
    <path d="M158 154 L184 212"/>
    <path d="M160 118 L124 100"/>
    <path d="M160 118 L184 140"/>
  </g>
  <circle cx="162" cy="88" r="17" fill="#4f46e5"/>
  <circle cx="172" cy="84" r="5" fill="#ffffff"/>
  <circle cx="174" cy="84" r="2.5" fill="#c0392f"/>
</svg>
