<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A seed whose coat has just split, pushing one white root down into the soil and one small green shoot up through the surface">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the soil, so that down and up both mean something -->
  <rect y="126" width="320" height="114" fill="#9aa2b4" fill-opacity=".55"/>
  <path d="M0 126 H320" stroke="#7b8399" stroke-width="4"/>
  <!-- the first root, pale and newly out -->
  <g fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round">
    <path d="M150 178 Q142 200 132 222"/>
    <path d="M144 198 L118 208"/>
    <path d="M138 212 L156 228"/>
  </g>
  <!-- the seed, its coat split open down the middle -->
  <g>
    <ellipse cx="152" cy="160" rx="30" ry="22" fill="#c9a227" stroke="#c9a227" stroke-width="3"/>
    <path d="M136 142 Q152 162 142 180" stroke="#eef0f5" stroke-width="5" fill="none"/>
  </g>
  <!-- the shoot, only just clear of the surface: the moment the word names -->
  <path d="M158 146 Q166 122 168 100" stroke="#2f6b4f" stroke-width="8" fill="none" stroke-linecap="round" opacity=".9"/>
  <path d="M168 104 Q146 98 142 74 Q166 74 170 100 Z" fill="#2f6b4f" opacity=".8"/>
  <path d="M170 110 Q194 104 198 82 Q174 82 170 108 Z" fill="#2f6b4f"/>
</svg>
