<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A flame under one end of a metal bar, with heat travelling the length of the bar to the hand gripping the far end">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- heat on its way along the bar, which is the whole point -->
  <g stroke="#c0392f" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M86 74 q 14 -12 28 0 t 28 0 t 28 0 t 28 0"/>
    <path d="M86 48 q 14 -12 28 0 t 28 0 t 28 0 t 28 0"/>
  </g>
  <g fill="#c0392f">
    <path d="M204 64 L226 74 L204 84 Z"/>
    <path d="M204 38 L226 48 L204 58 Z"/>
  </g>
  <!-- the bar -->
  <rect x="42" y="104" width="220" height="36" rx="5" fill="#9aa2b4" stroke="#7b8399" stroke-width="5"/>
  <path d="M58 115 L238 115" stroke="#cdd3e0" stroke-width="5" stroke-linecap="round"/>
  <!-- the flame heating one end -->
  <path d="M74 212 C 32 180, 60 148, 72 114 C 86 150, 116 180, 74 212 Z" fill="#c0392f"/>
  <path d="M74 200 C 50 178, 64 158, 72 136 C 82 160, 98 178, 74 200 Z" fill="#e0b73a"/>
  <!-- the hand at the other end, which is how you know the heat arrives -->
  <g fill="#4f46e5">
    <rect x="266" y="92" width="46" height="62" rx="15"/>
    <rect x="238" y="98" width="36" height="14" rx="7"/>
    <rect x="234" y="116" width="40" height="14" rx="7"/>
    <rect x="238" y="134" width="36" height="14" rx="7"/>
    <rect x="248" y="152" width="34" height="14" rx="7" transform="rotate(14 265 159)"/>
  </g>
</svg>
