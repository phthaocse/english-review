<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="From one starting dot a faint dashed arrow curves up to the place you would expect it to land, while the bold real arrow swings the opposite way and lands somewhere else entirely">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- where it starts -->
  <circle cx="34" cy="122" r="12" fill="#4f46e5"/>
  <!-- the way it looks as though it should go, drawn faint because it does not -->
  <path d="M34 122 Q112 38 220 44" fill="none" stroke="#9aa2b4" stroke-width="7"
        stroke-dasharray="13 11" stroke-linecap="round"/>
  <polygon points="240 46 214 34 216 58" fill="none" stroke="#9aa2b4" stroke-width="5"
           stroke-linejoin="round"/>
  <circle cx="276" cy="48" r="18" fill="none" stroke="#9aa2b4" stroke-width="5"
          stroke-dasharray="9 8"/>
  <!-- the way it really goes: the same start, the opposite bend -->
  <path d="M34 122 Q112 220 214 200" fill="none" stroke="#4f46e5" stroke-width="14"
        stroke-linecap="round"/>
  <polygon points="242 194 210 186 216 212" fill="#4f46e5"/>
  <circle cx="276" cy="190" r="19" fill="none" stroke="#c0392f" stroke-width="7"/>
  <circle cx="276" cy="190" r="7" fill="#c0392f"/>
</svg>
