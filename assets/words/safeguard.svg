<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A rock falling out of the sky strikes a shield that has been put in its way, and the person standing underneath is untouched">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground -->
  <path d="M28 226 L292 226" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- how fast it is coming down -->
  <g stroke="#9aa2b4" stroke-width="4" stroke-linecap="round">
    <path d="M118 6 L118 20"/><path d="M162 4 L162 16"/><path d="M204 6 L204 20"/>
  </g>
  <!-- the harm on its way -->
  <path d="M126 22 L146 10 L184 12 L200 30 L188 50 L140 50 Z" fill="#c0392f"/>
  <!-- it strikes the shield and stops there -->
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round">
    <path d="M124 54 L110 44"/><path d="M162 56 L162 44"/><path d="M200 54 L214 44"/>
  </g>
  <!-- the shield, put in the way on purpose before anything fell -->
  <path d="M108 62 L212 62 L212 106 Q212 138 160 154 Q108 138 108 106 Z" fill="#4f46e5"/>
  <path d="M120 74 L200 74 L200 104 Q200 128 160 141 Q120 128 120 104 Z"
        fill="none" stroke="#eef0f5" stroke-width="3" opacity=".6"/>
  <!-- the person it was put there for, standing under it unhurt -->
  <g fill="#7b8399" stroke="#7b8399">
    <circle cx="160" cy="176" r="16"/>
    <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M160 194 L160 206"/>
      <path d="M160 198 L140 190"/>
      <path d="M160 198 L180 190"/>
      <path d="M160 206 L148 226"/>
      <path d="M160 206 L172 226"/>
    </g>
  </g>
</svg>
