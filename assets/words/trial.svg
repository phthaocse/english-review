<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A court in session: the judge sitting high behind the bench with a gavel beside them, a boxed row of jurors, and the two opposing sides at their tables below">
  <rect width="320" height="240" fill="#eef0f5"/>
  <path d="M6 237 L314 237" stroke="#9aa2b4" stroke-width="5" stroke-linecap="round"/>
  <!-- the judge, sitting higher than everyone else -->
  <circle cx="122" cy="30" r="21" fill="#4f46e5"/>
  <path d="M80 78 Q122 30 164 78 Z" fill="#4f46e5"/>
  <!-- the bench: top rail, panel, plinth -->
  <rect x="26" y="78" width="196" height="15" fill="#7b8399"/>
  <rect x="34" y="93" width="180" height="46" fill="#9aa2b4" stroke="#7b8399" stroke-width="5"/>
  <rect x="46" y="139" width="156" height="15" fill="#7b8399"/>
  <!-- the gavel lying on the bench, which is what makes it a court and not a meeting -->
  <g transform="rotate(-18 180 70)">
    <rect x="162" y="60" width="38" height="18" rx="3" fill="#c9a227" stroke="#a8841c" stroke-width="2"/>
    <path d="M200 69 L234 69" stroke="#c9a227" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- the jurors, a row of people penned together in their own box -->
  <g fill="#9aa2b4">
    <circle cx="262" cy="104" r="12"/><circle cx="292" cy="104" r="12"/>
    <circle cx="248" cy="132" r="13"/><path d="M228 166 Q248 132 268 166 Z"/>
    <circle cx="278" cy="132" r="13"/><path d="M258 166 Q278 132 298 166 Z"/>
    <circle cx="308" cy="132" r="13"/><path d="M288 166 Q308 132 328 166 Z"/>
  </g>
  <rect x="228" y="160" width="90" height="50" rx="3" fill="#7b8399"/>
  <!-- the two sides, each at their own table, facing the bench -->
  <g fill="#5c6270">
    <circle cx="62" cy="176" r="18"/>
    <path d="M32 216 Q62 172 92 216 Z"/>
    <circle cx="170" cy="176" r="18"/>
    <path d="M140 216 Q170 172 200 216 Z"/>
  </g>
  <g fill="#9aa2b4" stroke="#7b8399" stroke-width="4">
    <rect x="12" y="214" width="102" height="14"/>
    <rect x="120" y="214" width="102" height="14"/>
  </g>
  <g fill="#7b8399">
    <rect x="20" y="228" width="10" height="9"/><rect x="96" y="228" width="10" height="9"/>
    <rect x="128" y="228" width="10" height="9"/><rect x="204" y="228" width="10" height="9"/>
  </g>
</svg>
