<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A balance whose right pan is pulled right down by a fat sack of coins while the empty left pan rides high, with a green arrow rising beside the loaded side">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- where the beam would sit if nothing were on it -->
  <path d="M30 112 H286" stroke="#9aa2b4" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- the stand: the fulcrum the beam pivots on, and its foot -->
  <g fill="#9aa2b4">
    <path d="M155 116 L190 200 L120 200 Z"/>
    <rect x="96" y="196" width="118" height="10" rx="5" fill="#7b8399"/>
  </g>
  <!-- the beam, tipped over towards whichever pan is loaded -->
  <g transform="rotate(15 155 112)">
    <rect x="63" y="107" width="184" height="10" rx="5" fill="#7b8399"/>
  </g>
  <!-- the empty pan, riding high -->
  <g stroke="#7b8399" stroke-width="3" fill="none">
    <path d="M66 90 L44 124"/><path d="M66 90 L88 124"/>
  </g>
  <path d="M40 124 Q66 146 92 124" fill="#9aa2b4"/>
  <!-- the loaded pan, pulled right down -->
  <g stroke="#7b8399" stroke-width="3" fill="none">
    <path d="M244 136 L214 176"/><path d="M244 136 L274 176"/>
  </g>
  <path d="M210 176 Q244 198 278 176" fill="#9aa2b4"/>
  <!-- the thing of worth doing the tipping: a full sack -->
  <path d="M231 126 Q208 150 216 174 L272 174 Q280 150 257 126 Z" fill="#4f46e5"/>
  <rect x="228" y="114" width="32" height="14" rx="7" fill="#3730a3"/>
  <!-- coins at its foot, so the weight reads as worth and not just mass -->
  <g fill="#e0b73a" stroke="#c9a227" stroke-width="2">
    <circle cx="222" cy="166" r="11"/><circle cx="244" cy="171" r="11"/><circle cx="266" cy="166" r="11"/>
  </g>
  <!-- which way this side moves you -->
  <g fill="#2f6b4f" stroke="#2f6b4f" stroke-width="8" stroke-linecap="round">
    <path d="M300 176 L300 102"/>
    <path d="M288 106 L312 106 L300 82 Z" stroke="none"/>
  </g>
</svg>
