<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A path running along a line up to a marked post and carrying on well beyond it, with the stretch after the post picked out in red">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground it all happens on -->
  <path d="M14 188 H306" stroke="#9aa2b4" stroke-width="8" stroke-linecap="round"/>
  <!-- the point being passed -->
  <rect x="152" y="74" width="12" height="114" fill="#7b8399"/>
  <path d="M164 78 L214 92 L164 106 Z" fill="#7b8399"/>
  <!-- the way up to the post: ordinary, grey -->
  <path d="M22 140 H152" stroke="#9aa2b4" stroke-width="10" stroke-linecap="round" stroke-dasharray="4 20"/>
  <!-- the stretch beyond it, which is what the word names -->
  <path d="M164 140 H272" stroke="#c0392f" stroke-width="14" stroke-linecap="round"/>
  <path d="M296 140 L266 122 L266 158 Z" fill="#c0392f"/>
  <!-- the thing travelling: faint where it started, solid where it has got to -->
  <circle cx="60" cy="140" r="18" fill="#4f46e5" opacity=".45"/>
  <circle cx="240" cy="140" r="22" fill="#4f46e5" stroke="#2e2896" stroke-width="4"/>
  <!-- a brace under the overshoot -->
  <path d="M164 208 V218 H272 V208" fill="none" stroke="#c0392f" stroke-width="5" stroke-linejoin="round"/>
</svg>
