<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A computer screen full of code lines with three red insects crawling across them">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the machine the code is running on -->
  <rect x="26" y="26" width="268" height="164" rx="12" fill="#7b8399"/>
  <rect x="40" y="40" width="240" height="136" fill="#ffffff"/>
  <rect x="136" y="190" width="48" height="20" fill="#7b8399"/>
  <rect x="98" y="208" width="124" height="14" rx="7" fill="#7b8399"/>
  <!-- lines of code, which is what the bugs are in -->
  <g fill="#4f46e5">
    <rect x="54" y="54" width="150" height="10" rx="5"/>
    <rect x="68" y="76" width="176" height="10" rx="5"/>
    <rect x="68" y="98" width="120" height="10" rx="5"/>
    <rect x="82" y="120" width="164" height="10" rx="5"/>
    <rect x="54" y="142" width="96" height="10" rx="5"/>
  </g>
  <!-- three bugs crawling over the lines -->
  <g stroke="#c0392f" stroke-width="3" stroke-linecap="round" fill="#c0392f">
    <g>
      <path d="M92 52 L74 42"/><path d="M92 60 L70 60"/><path d="M92 68 L74 78"/>
      <path d="M116 52 L134 42"/><path d="M116 60 L138 60"/><path d="M116 68 L134 78"/>
      <ellipse cx="104" cy="60" rx="17" ry="12" stroke="none"/>
      <circle cx="104" cy="44" r="7" stroke="none"/>
    </g>
    <g>
      <path d="M196 104 L178 94"/><path d="M196 112 L174 112"/><path d="M196 120 L178 130"/>
      <path d="M220 104 L238 94"/><path d="M220 112 L242 112"/><path d="M220 120 L238 130"/>
      <ellipse cx="208" cy="112" rx="17" ry="12" stroke="none"/>
      <circle cx="208" cy="96" r="7" stroke="none"/>
    </g>
    <g>
      <path d="M100 138 L82 128"/><path d="M100 146 L78 146"/><path d="M100 154 L82 164"/>
      <path d="M124 138 L142 128"/><path d="M124 146 L146 146"/><path d="M124 154 L142 164"/>
      <ellipse cx="112" cy="146" rx="17" ry="12" stroke="none"/>
      <circle cx="112" cy="130" r="7" stroke="none"/>
    </g>
  </g>
</svg>
