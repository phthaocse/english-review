<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One figure springing off the back of a crouching one and coming down in front of it, the jump traced as a dashed arc">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground both of them are on -->
  <path d="M12 200 L308 200" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- the arc of the jump, ending ahead of where it started -->
  <path d="M44 184 Q140 22 242 176" fill="none" stroke="#9aa2b4" stroke-width="4" stroke-dasharray="11 9"/>
  <path d="M228 152 L248 190 L212 182 Z" fill="#c0392f"/>
  <!-- the one bent over, being jumped -->
  <g fill="#9aa2b4">
    <path d="M56 200 Q98 130 138 200 Z"/>
    <circle cx="142" cy="176" r="15"/>
  </g>
  <!-- the one going over the top -->
  <g fill="#4f46e5" stroke="#4f46e5">
    <circle cx="150" cy="74" r="13"/>
    <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M142 86 L120 108"/>
      <path d="M120 108 L100 136"/>
      <path d="M142 86 L166 94"/>
      <path d="M166 94 L158 66"/>
      <path d="M166 94 L192 100"/>
    </g>
  </g>
</svg>
