<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A line of writing drawn as blocks: the block that starts the line stands tall and is ticked in green, while a block in the middle also stands tall and is crossed in red, with an arrow down to the flat block it should have been">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the words of the line, each one a flat block sitting on the baseline -->
  <g fill="#9aa2b4">
    <rect x="22" y="112" width="44" height="16" rx="3"/>
    <rect x="74" y="112" width="30" height="16" rx="3"/>
    <rect x="112" y="112" width="50" height="16" rx="3"/>
    <rect x="170" y="112" width="46" height="16" rx="3"/>
    <rect x="224" y="112" width="32" height="16" rx="3"/>
    <rect x="264" y="112" width="26" height="16" rx="3"/>
  </g>
  <!-- the full stop that closes the line -->
  <circle cx="300" cy="124" r="5" fill="#9aa2b4"/>
  <!-- the capital that belongs at the start of the line: a tall riser, in green -->
  <rect x="22" y="90" width="15" height="38" rx="3" fill="#2f6b4f"/>
  <!-- the capital that does not belong mid-line: the same riser, in red -->
  <rect x="170" y="90" width="15" height="38" rx="3" fill="#c0392f"/>
  <!-- tick over the one that is right, cross over the one that is wrong -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 60 l9 11 l19 -26" stroke="#2f6b4f"/>
    <path d="M181 56 L205 78" stroke="#c0392f"/>
    <path d="M205 56 L181 78" stroke="#c0392f"/>
  </g>
  <!-- the correction: that word should have stayed the same height as its neighbours -->
  <path d="M193 140 V170" stroke="#c0392f" stroke-width="5" stroke-dasharray="8 7"/>
  <polygon points="193,182 184,166 202,166" fill="#c0392f"/>
  <rect x="170" y="188" width="46" height="16" rx="3" fill="#2f6b4f"/>
  <path d="M232 192 l8 10 l16 -22" fill="none" stroke="#2f6b4f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
