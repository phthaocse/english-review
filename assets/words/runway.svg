<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="An aeroplane climbing away off the far end of a long marked strip that runs back towards the viewer">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the horizon, so the strip reads as lying flat and running away -->
  <path d="M0 128 L320 128" stroke="#9aa2b4" stroke-width="4"/>
  <!-- the strip itself, narrowing with distance -->
  <path d="M8 240 L152 240 L214 128 L196 128 Z" fill="#7b8399"/>
  <!-- edges, threshold bars across the near end, and the broken centre line -->
  <g stroke="#eef0f5" fill="none" stroke-width="4">
    <path d="M8 240 L196 128"/><path d="M152 240 L214 128"/>
  </g>
  <g fill="#eef0f5">
    <polygon points="24,240 40,240 77,214 64,214"/>
    <polygon points="56,240 72,240 103,214 90,214"/>
    <polygon points="88,240 104,240 128,214 115,214"/>
    <polygon points="120,240 136,240 154,214 141,214"/>
  </g>
  <path d="M108 214 L205 128" stroke="#eef0f5" stroke-width="10" stroke-dasharray="20 16"/>
  <!-- the aircraft, already off the ground and climbing -->
  <g transform="translate(228,74) rotate(-20)" fill="#4f46e5">
    <path d="M-50 -11 L26 -11 Q50 -11 60 0 Q50 11 26 11 L-50 11 Q-58 0 -50 -11 Z"/>
    <path d="M-12 7 L20 36 L37 36 L8 7 Z"/>
    <path d="M-8 -7 L13 -28 L28 -28 L4 -7 Z"/>
    <path d="M-44 -9 L-58 -40 L-44 -40 L-30 -9 Z"/>
    <path d="M-44 5 L-66 13 L-52 18 L-34 7 Z"/>
  </g>
</svg>
