<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A building cut open to show what it offers inside: a swimming pool with a ladder on the upper floor, a weights bench on the floor below, and a lift car on its cable in a shaft up one side">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the building itself, sliced open down the front -->
  <rect x="40" y="30" width="240" height="192" fill="#ffffff" stroke="#7b8399" stroke-width="5"/>
  <rect x="30" y="18" width="260" height="13" fill="#7b8399"/>
  <rect x="0" y="222" width="320" height="5" fill="#7b8399"/>
  <path d="M43 130 L219 130" stroke="#7b8399" stroke-width="5"/>
  <path d="M222 33 L222 219" stroke="#7b8399" stroke-width="5"/>
  <!-- upper floor: the pool, with a ladder over the side -->
  <rect x="62" y="64" width="136" height="48" rx="5" fill="#4f46e5"/>
  <g stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M74 80 Q88 70, 102 80 T130 80 T158 80 T186 80"/>
    <path d="M74 100 Q88 90, 102 100 T130 100 T158 100 T186 100"/>
  </g>
  <!-- lower floor: the gym, a bench under a loaded bar -->
  <g fill="#7b8399">
    <rect x="62" y="178" width="100" height="13" rx="4"/>
    <rect x="72" y="191" width="12" height="22"/>
    <rect x="140" y="191" width="12" height="22"/>
    <rect x="52" y="150" width="124" height="8" rx="4"/>
  </g>
  <g fill="#4f46e5">
    <rect x="45" y="138" width="14" height="32" rx="3"/>
    <rect x="170" y="138" width="14" height="32" rx="3"/>
  </g>
  <!-- the shaft up the side, with the lift car hanging in it -->
  <g stroke="#9aa2b4" stroke-width="3">
    <path d="M226 196 L276 196"/><path d="M226 78 L276 78"/>
  </g>
  <path d="M251 36 L251 112" stroke="#9aa2b4" stroke-width="4"/>
  <rect x="229" y="112" width="44" height="60" rx="3" fill="#4f46e5"/>
  <rect x="237" y="122" width="28" height="18" rx="2" fill="#eef0f5"/>
</svg>
