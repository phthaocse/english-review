<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Three small panels: a traffic light showing green, a tilted hand waving somebody on with an arrow, and a calendar with one day ringed and going off as planned">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the three senses kept apart -->
  <g stroke="#9aa2b4" stroke-width="2">
    <path d="M107 16 V224"/><path d="M213 16 V224"/>
  </g>
  <!-- first sense: permission given, the light has gone green -->
  <rect x="34" y="44" width="48" height="122" rx="13" fill="#7b8399"/>
  <circle cx="58" cy="72" r="14" fill="#9aa2b4"/>
  <circle cx="58" cy="106" r="14" fill="#9aa2b4"/>
  <circle cx="58" cy="142" r="22" fill="#2f6b4f" opacity="0.35"/>
  <circle cx="58" cy="142" r="14" fill="#2f6b4f"/>
  <rect x="52" y="166" width="12" height="52" fill="#7b8399"/>
  <!-- second sense: somebody being waved on ahead of you -->
  <g fill="#4f46e5" transform="rotate(-20 164 126)">
    <rect x="142" y="100" width="44" height="52" rx="14"/>
    <rect x="144" y="72" width="9" height="34" rx="4.5"/>
    <rect x="155" y="68" width="9" height="38" rx="4.5"/>
    <rect x="166" y="70" width="9" height="36" rx="4.5"/>
    <rect x="177" y="76" width="9" height="30" rx="4.5"/>
    <rect x="128" y="108" width="30" height="15" rx="7.5" transform="rotate(-28 143 115)"/>
    <rect x="148" y="150" width="32" height="24" rx="6"/>
  </g>
  <!-- the sweep of the wave, and the direction it is sending them -->
  <g fill="none" stroke="#9aa2b4" stroke-width="5" stroke-linecap="round">
    <path d="M124 64 L134 74"/><path d="M114 82 L127 86"/>
  </g>
  <path d="M124 202 H176" stroke="#c0392f" stroke-width="8" stroke-linecap="round"/>
  <polygon points="194 202 172 191 172 213" fill="#c0392f"/>
  <!-- third sense: the event went ahead, on the day it was booked for -->
  <rect x="228" y="70" width="82" height="96" rx="8" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
  <path d="M228 78 q0 -8 8 -8 h66 q8 0 8 8 v14 h-82 z" fill="#7b8399"/>
  <g fill="#9aa2b4">
    <rect x="238" y="102" width="13" height="11"/><rect x="257" y="102" width="13" height="11"/>
    <rect x="276" y="102" width="13" height="11"/><rect x="238" y="122" width="13" height="11"/>
    <rect x="276" y="122" width="13" height="11"/><rect x="238" y="142" width="13" height="11"/>
    <rect x="257" y="142" width="13" height="11"/><rect x="276" y="142" width="13" height="11"/>
  </g>
  <rect x="257" y="122" width="13" height="11" fill="#4f46e5"/>
  <circle cx="263.5" cy="127.5" r="17" fill="none" stroke="#c0392f" stroke-width="4"/>
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
    <path d="M263.5 100 V92"/><path d="M285 110 L291 104"/><path d="M285 145 L291 151"/>
    <path d="M242 110 L236 104"/><path d="M242 145 L236 151"/>
  </g>
</svg>
