<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Grain left fully under the water line in a tank, swelling as it takes the liquid in">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the tank -->
  <path d="M66 46 L66 206 Q66 218 78 218 L242 218 Q254 218 254 206 L254 46"
        fill="none" stroke="#7b8399" stroke-width="7" stroke-linejoin="round"/>
  <!-- water, filled well above what is steeping -->
  <path d="M73 96 L73 206 Q73 211 78 211 L242 211 Q247 211 247 206 L247 96 Z" fill="#4f46e5" opacity=".28"/>
  <path d="M73 96 Q100 86 128 96 T182 96 T247 96" stroke="#4f46e5" stroke-width="5" fill="none"/>
  <!-- grain resting under it, swollen -->
  <g fill="#e0b73a" stroke="#a8841c" stroke-width="2">
    <ellipse cx="112" cy="188" rx="16" ry="12"/><ellipse cx="150" cy="194" rx="16" ry="12"/>
    <ellipse cx="190" cy="188" rx="16" ry="12"/><ellipse cx="131" cy="168" rx="15" ry="11"/>
    <ellipse cx="171" cy="170" rx="15" ry="11"/><ellipse cx="210" cy="170" rx="15" ry="11"/>
  </g>
  <!-- taking the liquid in -->
  <g stroke="#4f46e5" stroke-width="3" stroke-linecap="round" opacity=".75" fill="none">
    <path d="M112 152 L112 168"/><path d="M107 162 L112 170 L117 162"/>
    <path d="M190 152 L190 168"/><path d="M185 162 L190 170 L195 162"/>
  </g>
</svg>
