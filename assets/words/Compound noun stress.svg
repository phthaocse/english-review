<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A compound word built from two joined blocks, the first block much larger and carrying a dot above it to mark where the stress falls">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the stress dot, sitting over the first half of the compound -->
  <circle cx="104" cy="52" r="15" fill="#c0392f"/>
  <!-- first half: the stressed one, drawn big -->
  <rect x="26" y="86" width="156" height="94" rx="12" fill="#4f46e5"/>
  <text x="104" y="150" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" fill="#ffffff">BOOK</text>
  <!-- second half: joined on, unstressed, drawn small and grey -->
  <rect x="182" y="120" width="112" height="60" rx="10" fill="#9aa2b4"/>
  <text x="238" y="162" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#ffffff">shop</text>
  <!-- the bar under both, showing the two halves are one word -->
  <rect x="26" y="192" width="268" height="10" rx="5" fill="#7b8399"/>
</svg>
