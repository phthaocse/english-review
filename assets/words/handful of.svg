<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="An open hand, fingers up and thumb out, with five small round objects sitting in the palm">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the wrist, so the shape is unmistakably a hand -->
  <rect x="132" y="196" width="56" height="44" rx="10" fill="#4f46e5"/>
  <!-- four fingers, fanned and clearly separate -->
  <g fill="#4f46e5">
    <rect x="100" y="80" width="24" height="68" rx="12" transform="rotate(-12 112 148)"/>
    <rect x="130" y="68" width="24" height="80" rx="12" transform="rotate(-4 142 148)"/>
    <rect x="160" y="68" width="24" height="80" rx="12" transform="rotate(4 172 148)"/>
    <rect x="190" y="80" width="24" height="68" rx="12" transform="rotate(12 202 148)"/>
  </g>
  <!-- the thumb, out to the side, which is what settles it as a hand -->
  <rect x="93" y="126" width="26" height="66" rx="13" fill="#4f46e5"
        transform="rotate(-45 106 192)"/>
  <!-- the palm -->
  <rect x="100" y="128" width="120" height="84" rx="22" fill="#4f46e5"/>
  <!-- what is being held: few enough to count without thinking -->
  <g fill="#e0b73a" stroke="#c9a227" stroke-width="3">
    <circle cx="127" cy="172" r="15"/><circle cx="160" cy="176" r="15"/><circle cx="193" cy="172" r="15"/>
    <circle cx="143" cy="145" r="15"/><circle cx="177" cy="145" r="15"/>
  </g>
</svg>
