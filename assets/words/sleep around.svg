<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One person in the middle joined by short dashed lines to five separate people placed around them, none of whom are joined to each other">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the links, one to each of them, drawn dashed because none of them lasts -->
  <g stroke="#7b8399" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round">
    <path d="M160 132 L58 62"/>
    <path d="M160 132 L160 48"/>
    <path d="M160 132 L262 62"/>
    <path d="M160 132 L50 184"/>
    <path d="M160 132 L270 184"/>
  </g>
  <!-- the five other people, each on their own, unconnected to one another -->
  <g fill="#9aa2b4">
    <circle cx="52" cy="44" r="15"/><path d="M32 96 Q32 60 52 56 Q72 60 72 96 Z"/>
    <circle cx="160" cy="30" r="15"/><path d="M140 82 Q140 46 160 42 Q180 46 180 82 Z"/>
    <circle cx="268" cy="44" r="15"/><path d="M248 96 Q248 60 268 56 Q288 60 288 96 Z"/>
    <circle cx="44" cy="176" r="15"/><path d="M24 228 Q24 192 44 188 Q64 192 64 228 Z"/>
    <circle cx="276" cy="176" r="15"/><path d="M256 228 Q256 192 276 188 Q296 192 296 228 Z"/>
  </g>
  <!-- the one in the middle, who is in all five of them -->
  <circle cx="160" cy="118" r="23" fill="#4f46e5"/>
  <path d="M132 192 Q132 138 160 134 Q188 138 188 192 Z" fill="#4f46e5"/>
</svg>
