<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A head seen from the side with three interlocking gears turning inside the skull where the brain would be">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the head in profile, facing left -->
  <path d="M246 240 L246 176 C256 154 258 132 254 110 C246 66 214 36 170 34
           C130 32 100 62 96 98 L92 114 L62 142 L88 152 L84 170 L104 178 L98 198
           C102 218 130 230 162 232 L162 240 Z"
        fill="#dcdaf9" stroke="#4f46e5" stroke-width="5" stroke-linejoin="round"/>
  <!-- the big wheel: the thought being worked out -->
  <g fill="#4f46e5">
    <circle cx="166" cy="94" r="30"/>
    <g>
      <rect x="159" y="54" width="14" height="15" rx="3"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(40 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(80 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(120 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(160 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(200 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(240 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(280 166 94)"/>
      <rect x="159" y="54" width="14" height="15" rx="3" transform="rotate(320 166 94)"/>
    </g>
  </g>
  <circle cx="166" cy="94" r="10" fill="#dcdaf9"/>
  <!-- the wheel it drives at the back of the skull -->
  <g fill="#7b8399">
    <circle cx="224" cy="132" r="21"/>
    <g>
      <rect x="218" y="102" width="12" height="13" rx="3"/>
      <rect x="218" y="102" width="12" height="13" rx="3" transform="rotate(51 224 132)"/>
      <rect x="218" y="102" width="12" height="13" rx="3" transform="rotate(103 224 132)"/>
      <rect x="218" y="102" width="12" height="13" rx="3" transform="rotate(154 224 132)"/>
      <rect x="218" y="102" width="12" height="13" rx="3" transform="rotate(206 224 132)"/>
      <rect x="218" y="102" width="12" height="13" rx="3" transform="rotate(257 224 132)"/>
      <rect x="218" y="102" width="12" height="13" rx="3" transform="rotate(309 224 132)"/>
    </g>
  </g>
  <circle cx="224" cy="132" r="7" fill="#dcdaf9"/>
  <!-- and the small one it drives down towards the front -->
  <g fill="#4f46e5">
    <circle cx="130" cy="146" r="18"/>
    <g>
      <rect x="124" y="120" width="12" height="12" rx="3"/>
      <rect x="124" y="120" width="12" height="12" rx="3" transform="rotate(51 130 146)"/>
      <rect x="124" y="120" width="12" height="12" rx="3" transform="rotate(103 130 146)"/>
      <rect x="124" y="120" width="12" height="12" rx="3" transform="rotate(154 130 146)"/>
      <rect x="124" y="120" width="12" height="12" rx="3" transform="rotate(206 130 146)"/>
      <rect x="124" y="120" width="12" height="12" rx="3" transform="rotate(257 130 146)"/>
      <rect x="124" y="120" width="12" height="12" rx="3" transform="rotate(309 130 146)"/>
    </g>
  </g>
  <circle cx="130" cy="146" r="6" fill="#dcdaf9"/>
</svg>
