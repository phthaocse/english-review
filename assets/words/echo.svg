<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A speech bubble with two steadily fainter copies of itself trailing away to the side">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- what was said -->
  <g fill="#4f46e5">
    <rect x="18" y="72" width="106" height="64" rx="16"/>
    <path d="M40 132 L34 166 L68 136 Z"/>
  </g>
  <g fill="#eef0f5">
    <circle cx="48" cy="104" r="7"/><circle cx="71" cy="104" r="7"/><circle cx="94" cy="104" r="7"/>
  </g>
  <!-- the same thing said back, weaker -->
  <g fill="#4f46e5" opacity=".52">
    <rect x="146" y="82" width="86" height="52" rx="13"/>
    <path d="M164 130 L159 156 L187 134 Z"/>
  </g>
  <g fill="#eef0f5" opacity=".52">
    <circle cx="169" cy="108" r="6"/><circle cx="188" cy="108" r="6"/><circle cx="207" cy="108" r="6"/>
  </g>
  <!-- and again, fainter still -->
  <g fill="#4f46e5" opacity=".24">
    <rect x="248" y="92" width="62" height="38" rx="10"/>
    <path d="M261 126 L257 146 L278 130 Z"/>
  </g>
  <g fill="#eef0f5" opacity=".24">
    <circle cx="265" cy="111" r="5"/><circle cx="279" cy="111" r="5"/><circle cx="293" cy="111" r="5"/>
  </g>
</svg>
