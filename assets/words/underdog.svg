<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A race almost over: two runners are reaching the finish line while the one picked out in colour is still trailing far behind">
  <rect width="320" height="240" fill="#eef0f5"/>
  <defs>
    <!-- one running figure, reused for all three -->
    <g id="runner">
      <circle cx="26" cy="9" r="9"/>
      <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M24 18 L18 36"/>
        <path d="M23 24 L37 17"/>
        <path d="M23 24 L9 30"/>
        <path d="M18 36 L30 45 L27 56"/>
        <path d="M18 36 L7 44 L12 56"/>
      </g>
    </g>
  </defs>
  <!-- the lanes -->
  <g stroke="#9aa2b4" stroke-width="3" stroke-dasharray="14 12">
    <path d="M0 104 L320 104"/><path d="M0 152 L320 152"/><path d="M0 200 L320 200"/>
  </g>
  <!-- the finish, a stride away for the leaders -->
  <g fill="#7b8399">
    <rect x="286" y="56" width="10" height="152"/>
    <rect x="286" y="56" width="10" height="20"/><rect x="296" y="76" width="10" height="20"/>
    <rect x="286" y="96" width="10" height="20"/><rect x="296" y="116" width="10" height="20"/>
    <rect x="286" y="136" width="10" height="20"/><rect x="296" y="156" width="10" height="20"/>
    <rect x="286" y="176" width="10" height="20"/>
  </g>
  <!-- how much ground is left to make up -->
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
    <path d="M78 26 L78 46"/><path d="M226 26 L226 46"/>
    <path d="M78 36 L226 36" stroke-dasharray="9 8"/>
  </g>
  <!-- the two about to win it -->
  <g fill="#9aa2b4" stroke="#9aa2b4">
    <use href="#runner" x="226" y="48"/>
    <use href="#runner" x="212" y="144"/>
  </g>
  <!-- the one nobody is backing, still out at the back -->
  <g fill="#4f46e5" stroke="#4f46e5">
    <use href="#runner" x="32" y="96"/>
  </g>
</svg>
