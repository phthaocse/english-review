<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A hand pressing down on a cut lemon half hard enough to force one last drop out of it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the cut half, squat because it is being pressed, segments showing -->
  <ellipse cx="160" cy="144" rx="86" ry="50" fill="#e0b73a" stroke="#c9a227" stroke-width="8"/>
  <ellipse cx="160" cy="144" rx="70" ry="37" fill="#eed27a"/>
  <g stroke="#c9a227" stroke-width="4" stroke-linecap="round">
    <path d="M160 144 L160 107"/><path d="M160 144 L215 126"/><path d="M160 144 L230 144"/>
    <path d="M160 144 L215 162"/><path d="M160 144 L160 181"/><path d="M160 144 L105 162"/>
    <path d="M160 144 L90 144"/><path d="M160 144 L105 126"/>
  </g>
  <!-- the hand doing the pressing: forearm, knuckles, four fingers with daylight between them -->
  <g fill="#4f46e5">
    <rect x="126" y="0" width="68" height="34"/>
    <rect x="86" y="20" width="148" height="50" rx="24"/>
    <rect x="90" y="54" width="30" height="60" rx="14"/>
    <rect x="126" y="54" width="30" height="60" rx="14"/>
    <rect x="162" y="54" width="30" height="60" rx="14"/>
    <rect x="198" y="54" width="30" height="60" rx="14"/>
    <ellipse cx="248" cy="86" rx="17" ry="30" transform="rotate(22 248 86)"/>
  </g>
  <!-- how hard it is being pressed -->
  <g fill="#c0392f">
    <path d="M18 144 L52 130 L52 158 Z"/>
    <path d="M302 144 L268 130 L268 158 Z"/>
  </g>
  <!-- and all that is left to come out of it -->
  <path d="M160 196 C 150 212, 146 218, 146 222 a 14 14 0 0 0 28 0 c 0 -4 -4 -10 -14 -26 Z" fill="#e0b73a"/>
</svg>
