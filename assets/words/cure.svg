<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two panels side by side: a fish hung up to dry with salt being shaken over it, and a medicine phial with a green tick beside it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the rule dividing the two unrelated senses -->
  <path d="M160 16 V224" stroke="#9aa2b4" stroke-width="2"/>
  <!-- left panel: the salt cellar doing the preserving -->
  <g transform="rotate(38 34 40)">
    <rect x="20" y="16" width="30" height="40" rx="6" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
    <rect x="18" y="10" width="34" height="12" rx="4" fill="#7b8399"/>
  </g>
  <g fill="#ffffff" stroke="#7b8399" stroke-width="2">
    <rect x="44" y="68" width="10" height="10" transform="rotate(45 49 73)"/>
    <rect x="32" y="100" width="10" height="10" transform="rotate(45 37 105)"/>
    <rect x="48" y="134" width="10" height="10" transform="rotate(45 53 139)"/>
    <rect x="34" y="168" width="10" height="10" transform="rotate(45 39 173)"/>
    <rect x="116" y="112" width="10" height="10" transform="rotate(45 121 117)"/>
    <rect x="124" y="152" width="10" height="10" transform="rotate(45 129 157)"/>
    <rect x="110" y="188" width="10" height="10" transform="rotate(45 115 193)"/>
  </g>
  <!-- the fish, hung on a line in the air -->
  <path d="M74 60 H150" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <path d="M96 60 V78" stroke="#7b8399" stroke-width="4"/>
  <path d="M96 66 L74 40 L118 40 Z" fill="#9aa2b4"/>
  <path d="M96 78 C66 112, 66 172, 96 206 C126 172, 126 112, 96 78 Z" fill="#9aa2b4"/>
  <circle cx="96" cy="184" r="8" fill="#ffffff"/>
  <circle cx="96" cy="184" r="4" fill="#7b8399"/>
  <g stroke="#7b8399" stroke-width="3">
    <path d="M76 124 H116"/><path d="M74 146 H118"/>
  </g>
  <!-- right panel: the remedy that puts an illness right -->
  <rect x="204" y="62" width="30" height="16" rx="4" fill="#7b8399"/>
  <rect x="210" y="78" width="18" height="22" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
  <rect x="194" y="98" width="50" height="94" rx="12" fill="#ffffff" stroke="#7b8399" stroke-width="4"/>
  <path d="M198 142 h42 v38 a10 10 0 0 1 -10 10 h-22 a10 10 0 0 1 -10 -10 z" fill="#4f46e5"/>
  <!-- the tick: it worked -->
  <path d="M258 140 l16 20 l32 -48" fill="none" stroke="#2f6b4f" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
