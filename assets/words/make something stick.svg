<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A hand with one finger out pushing a red pin through a note into a board, with motion streaks trailing behind it and small marks bursting from the pinhead">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the board it has to stay on -->
  <rect x="22" y="26" width="276" height="188" rx="8" fill="#9aa2b4" stroke="#7b8399" stroke-width="8"/>
  <!-- the note being fixed to it -->
  <g transform="rotate(-6 128 138)">
    <rect x="66" y="84" width="124" height="112" rx="3" fill="#e0b73a"/>
    <g stroke="#a8841c" stroke-width="6" stroke-linecap="round">
      <path d="M82 136 H174"/>
      <path d="M82 156 H156"/>
      <path d="M82 176 H168"/>
    </g>
  </g>
  <!-- the streaks left behind by the hand coming down -->
  <g stroke="#7b8399" stroke-width="6" stroke-linecap="round">
    <path d="M228 52 L244 38"/>
    <path d="M254 44 L270 30"/>
    <path d="M280 52 L294 40"/>
  </g>
  <!-- the forearm, and the fist it ends in -->
  <path d="M320 70 L320 150 L280 154 L274 74 Z" fill="#4f46e5"/>
  <path d="M278 80 L284 148" stroke="#3730a3" stroke-width="4" stroke-linecap="round"/>
  <rect x="206" y="72" width="78" height="82" rx="26" fill="#4f46e5"/>
  <!-- the fingers curled out of the way -->
  <g fill="#4f46e5" stroke="#3730a3" stroke-width="3">
    <rect x="194" y="102" width="58" height="24" rx="12"/>
    <rect x="200" y="128" width="52" height="22" rx="11"/>
  </g>
  <!-- the one finger doing the pressing -->
  <rect x="150" y="68" width="102" height="28" rx="14" fill="#4f46e5" stroke="#3730a3" stroke-width="3"/>
  <!-- the pin going in -->
  <circle cx="146" cy="94" r="17" fill="#c0392f"/>
  <circle cx="140" cy="88" r="5" fill="#ffffff"/>
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round">
    <path d="M146 64 V48"/>
    <path d="M120 76 L106 66"/>
    <path d="M118 108 L102 116"/>
  </g>
</svg>
