<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A grey block with its padlock sprung open lifting out of a bay, leaving the bay empty and dashed while a second blue block moves in to take it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the shelf everything sits on -->
  <rect x="86" y="190" width="150" height="9" rx="4" fill="#7b8399"/>
  <!-- the space that has just come free -->
  <rect x="108" y="100" width="90" height="90" rx="6" fill="#ffffff" opacity="0.55"/>
  <rect x="108" y="100" width="90" height="90" rx="6" fill="none" stroke="#9aa2b4" stroke-width="5" stroke-dasharray="13 10"/>
  <!-- the block that was in it, unlocked and on its way out -->
  <rect x="14" y="28" width="80" height="70" rx="8" fill="#7b8399"/>
  <path d="M44 62 L44 48 A11 11 0 0 1 64 42" fill="none" stroke="#c0392f" stroke-width="7" stroke-linecap="round"/>
  <rect x="38" y="60" width="34" height="26" rx="5" fill="#c0392f"/>
  <!-- the route it took out of the bay -->
  <path d="M128 110 L110 90" stroke="#7b8399" stroke-width="6" stroke-dasharray="9 7" stroke-linecap="round"/>
  <polygon points="98,78 117,85 104,97" fill="#7b8399"/>
  <!-- the next thing, moving in to use the space -->
  <rect x="236" y="112" width="74" height="66" rx="8" fill="#4f46e5"/>
  <path d="M230 145 L214 145" stroke="#4f46e5" stroke-width="13" stroke-linecap="round"/>
  <polygon points="212,130 190,145 212,160" fill="#4f46e5"/>
</svg>
