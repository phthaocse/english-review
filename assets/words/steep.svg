<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Grain sitting well under the water line in a jar, beside a clock whose hands have swept round to show hours passing">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the vessel -->
  <path d="M28 54 L28 190 Q28 206 44 206 L152 206 Q168 206 168 190 L168 54"
        fill="none" stroke="#7b8399" stroke-width="7" stroke-linejoin="round"/>
  <!-- the liquid, well above whatever is in it -->
  <path d="M35 92 L35 190 Q35 199 44 199 L152 199 Q161 199 161 190 L161 92 Z" fill="#4f46e5" opacity=".28"/>
  <path d="M35 92 Q60 82 86 92 T136 92 T161 92" stroke="#4f46e5" stroke-width="5" fill="none"/>
  <!-- the grain lying under it, left there rather than worked -->
  <g fill="#e0b73a" stroke="#c9a227" stroke-width="2">
    <ellipse cx="62" cy="184" rx="16" ry="11"/><ellipse cx="98" cy="188" rx="16" ry="11"/>
    <ellipse cx="134" cy="184" rx="16" ry="11"/><ellipse cx="80" cy="166" rx="15" ry="10"/>
    <ellipse cx="117" cy="166" rx="15" ry="10"/>
  </g>
  <!-- the clock: the whole point is that this takes time -->
  <circle cx="248" cy="134" r="54" fill="#eef0f5" stroke="#7b8399" stroke-width="7"/>
  <g stroke="#7b8399" stroke-width="5" stroke-linecap="round">
    <path d="M248 88 V98"/><path d="M294 134 H284"/><path d="M248 180 V170"/><path d="M202 134 H212"/>
  </g>
  <g stroke="#4f46e5" stroke-width="7" stroke-linecap="round">
    <path d="M248 134 V102"/><path d="M248 134 L276 148"/>
  </g>
  <!-- hours going by while nothing is done to it -->
  <path d="M296 96 A 62 62 0 0 1 300 158" fill="none" stroke="#c0392f" stroke-width="5"/>
  <path d="M300 168 L292 146 L310 150 Z" fill="#c0392f"/>
</svg>
