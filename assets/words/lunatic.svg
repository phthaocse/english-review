<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A figure leaping clear of the ground with arms and legs flung wide and a hat tumbling off above, its shadow pooled on the ground beneath">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground it is no longer touching -->
  <path d="M0 226 L320 226" stroke="#7b8399" stroke-width="4"/>
  <ellipse cx="146" cy="224" rx="54" ry="9" fill="#9aa2b4" opacity="0.65"/>
  <!-- the arc the hat took getting away -->
  <path d="M158 84 Q196 44 220 44" fill="none" stroke="#9aa2b4" stroke-width="4" stroke-dasharray="7 8" stroke-linecap="round"/>
  <!-- the hat, gone -->
  <g transform="translate(248,44) rotate(-32)">
    <ellipse cx="0" cy="6" rx="32" ry="9" fill="#7b8399"/>
    <path d="M-19 6 L-15 -22 L15 -22 L19 6 Z" fill="#7b8399"/>
  </g>
  <!-- everything flung out at once -->
  <g stroke="#4f46e5" stroke-width="15" stroke-linecap="round" fill="none">
    <path d="M146 126 L146 166"/>
    <path d="M146 136 L88 100"/>
    <path d="M146 136 L204 100"/>
    <path d="M146 166 L98 208"/>
    <path d="M146 166 L196 208"/>
  </g>
  <circle cx="146" cy="106" r="19" fill="#4f46e5"/>
  <circle cx="139" cy="102" r="5" fill="#ffffff"/>
  <circle cx="154" cy="102" r="5" fill="#ffffff"/>
  <circle cx="139" cy="102" r="2.5" fill="#c0392f"/>
  <circle cx="154" cy="102" r="2.5" fill="#c0392f"/>
</svg>
