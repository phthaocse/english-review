<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A road running into the distance with a felled tree lying right across it and one car halted a short way short of the trunk">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the road, running away from the viewer -->
  <path d="M60 240 L130 60 L190 60 L260 240 Z" fill="#9aa2b4"/>
  <path d="M160 236 L160 66" stroke="#eef0f5" stroke-width="6" stroke-dasharray="16 15"/>
  <!-- the fallen trunk: the obstruction, laid clean across both lanes -->
  <path d="M46 116 L274 154" stroke="#8a6a12" stroke-width="26" stroke-linecap="round"/>
  <path d="M54 109 L268 145" stroke="#c9a227" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <circle cx="42" cy="114" r="18" fill="#8a6a12"/>
  <!-- its crown, spilling off the far verge -->
  <g fill="#2f6b4f">
    <circle cx="286" cy="138" r="22"/><circle cx="304" cy="166" r="17"/><circle cx="272" cy="172" r="17"/>
  </g>
  <!-- the car, stopped short with its brake lights on -->
  <path d="M126 190 L136 166 L184 166 L194 190 Z" fill="#4f46e5"/>
  <rect x="141" y="170" width="38" height="16" rx="3" fill="#9aa2b4"/>
  <rect x="110" y="188" width="100" height="38" rx="8" fill="#4f46e5"/>
  <g fill="#c0392f">
    <rect x="116" y="196" width="22" height="12" rx="4"/>
    <rect x="182" y="196" width="22" height="12" rx="4"/>
  </g>
</svg>
