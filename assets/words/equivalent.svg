<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A balance at rest with a square block on one pan and a round ball on the other, the beam sitting perfectly level">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the stand the beam pivots on -->
  <g fill="#7b8399">
    <rect x="152" y="86" width="16" height="118"/>
    <path d="M118 212 L202 212 L188 198 L132 198 Z"/>
    <path d="M160 62 L182 90 L138 90 Z"/>
  </g>
  <!-- the beam, dead level: neither side outweighs the other -->
  <rect x="52" y="60" width="216" height="10" rx="5" fill="#7b8399"/>
  <!-- left pan, hung from the beam -->
  <g stroke="#9aa2b4" stroke-width="3" fill="none">
    <path d="M78 70 L52 122"/><path d="M78 70 L104 122"/>
  </g>
  <path d="M48 122 Q78 152 108 122 Z" fill="#9aa2b4"/>
  <!-- right pan, hung at exactly the same height -->
  <g stroke="#9aa2b4" stroke-width="3" fill="none">
    <path d="M242 70 L216 122"/><path d="M242 70 L268 122"/>
  </g>
  <path d="M212 122 Q242 152 272 122 Z" fill="#9aa2b4"/>
  <!-- two quite different things that weigh the same -->
  <rect x="62" y="100" width="34" height="34" rx="3" fill="#4f46e5"/>
  <circle cx="242" cy="118" r="18" fill="#e0b73a" stroke="#c9a227" stroke-width="3"/>
</svg>
