<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One incoming request splitting in two: a solid line into a live system whose answer goes on out, and a dashed copy into a second greyed-out system whose answer is thrown away">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the real traffic arriving, and the point it is copied at -->
  <path d="M8 124 H62" stroke="#4f46e5" stroke-width="8"/>
  <circle cx="64" cy="124" r="9" fill="#4f46e5"/>
  <!-- the branch that is actually served -->
  <g fill="none" stroke="#4f46e5" stroke-width="8" stroke-linejoin="round">
    <path d="M64 124 V72 H104"/>
  </g>
  <path d="M102 60 L126 72 L102 84 Z" fill="#4f46e5"/>
  <rect x="128" y="42" width="92" height="60" rx="9" fill="#4f46e5"/>
  <g fill="#eef0f5"><circle cx="152" cy="72" r="6"/><circle cx="174" cy="72" r="6"/><circle cx="196" cy="72" r="6"/></g>
  <!-- its answer, which is the one that gets used -->
  <path d="M220 72 H286" stroke="#4f46e5" stroke-width="8"/>
  <path d="M284 60 L308 72 L284 84 Z" fill="#4f46e5"/>
  <!-- the copy, sent to the system being tried out -->
  <g fill="none" stroke="#9aa2b4" stroke-width="6" stroke-dasharray="10 8" stroke-linejoin="round">
    <path d="M64 124 V176 H104"/>
  </g>
  <path d="M102 165 L124 176 L102 187 Z" fill="#9aa2b4"/>
  <rect x="128" y="146" width="92" height="60" rx="9" fill="none" stroke="#9aa2b4" stroke-width="6" stroke-dasharray="11 8"/>
  <g fill="#9aa2b4"><circle cx="152" cy="176" r="6"/><circle cx="174" cy="176" r="6"/><circle cx="196" cy="176" r="6"/></g>
  <!-- its answer, compared and then thrown away -->
  <path d="M220 176 H258" stroke="#9aa2b4" stroke-width="6" stroke-dasharray="10 8"/>
  <g stroke="#c0392f" stroke-width="8" stroke-linecap="round">
    <path d="M268 162 L296 190"/><path d="M296 162 L268 190"/>
  </g>
</svg>
