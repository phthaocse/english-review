<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A two-block word with a red stress dot over its first block, and below it the same word with a third block added on the end, where a red arrow shows the dot has moved from the first block to the second">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the plain word: two blocks, stressed on the first -->
  <circle cx="99" cy="38" r="11" fill="#c0392f"/>
  <rect x="62" y="56" width="74" height="38" rx="6" fill="#4f46e5"/>
  <rect x="142" y="56" width="56" height="38" rx="6" fill="#4f46e5"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#ffffff" text-anchor="middle">
    <text x="99" y="83">meth</text>
    <text x="170" y="83">od</text>
  </g>
  <!-- where the stress used to sit, and where it sits once the suffix is on -->
  <circle cx="79" cy="132" r="11" fill="none" stroke="#c0392f" stroke-width="4" opacity=".5"/>
  <circle cx="150" cy="132" r="11" fill="#c0392f"/>
  <!-- the move: one block to the right -->
  <path d="M94 132 H132" stroke="#c0392f" stroke-width="6" stroke-linecap="round"/>
  <polygon points="140,132 126,124 126,140" fill="#c0392f"/>
  <!-- the same word with the suffix tile added on the end -->
  <rect x="42" y="150" width="74" height="38" rx="6" fill="#4f46e5"/>
  <rect x="122" y="150" width="56" height="38" rx="6" fill="#4f46e5"/>
  <rect x="184" y="150" width="92" height="38" rx="6" fill="#e0b73a"/>
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" text-anchor="middle">
    <text x="79" y="177" fill="#ffffff">meth</text>
    <text x="150" y="177" fill="#ffffff">od</text>
    <text x="230" y="177" fill="#a8841c">-ical</text>
  </g>
</svg>
