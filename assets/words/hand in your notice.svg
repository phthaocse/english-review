<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One hand holding a sealed letter out across a desk and a second hand reaching in from the other side to take it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the desk it is being handed across -->
  <rect x="18" y="172" width="284" height="16" rx="5" fill="#7b8399"/>
  <g fill="#9aa2b4">
    <rect x="44" y="188" width="15" height="46"/>
    <rect x="261" y="188" width="15" height="46"/>
  </g>
  <!-- the hand giving it up -->
  <g fill="#4f46e5">
    <rect x="-8" y="110" width="66" height="38" rx="19"/>
    <path d="M50 104 L106 104 Q124 104 124 121 L124 141 Q124 156 106 156 L50 156 Z"/>
    <ellipse cx="90" cy="98" rx="21" ry="10" transform="rotate(-16 90 98)"/>
  </g>
  <g stroke="#eef0f5" stroke-width="3" stroke-linecap="round">
    <path d="M96 114 H121"/><path d="M98 128 H124"/><path d="M96 142 H121"/>
  </g>
  <!-- the hand taking it -->
  <g fill="#7b8399">
    <rect x="262" y="110" width="66" height="38" rx="19"/>
    <path d="M270 104 L214 104 Q196 104 196 121 L196 141 Q196 156 214 156 L270 156 Z"/>
    <ellipse cx="230" cy="98" rx="21" ry="10" transform="rotate(16 230 98)"/>
  </g>
  <g stroke="#eef0f5" stroke-width="3" stroke-linecap="round">
    <path d="M199 114 H224"/><path d="M196 128 H222"/><path d="M199 142 H224"/>
  </g>
  <!-- the letter itself, sealed shut -->
  <rect x="127" y="100" width="66" height="50" rx="3" fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <path d="M127 100 L160 127 L193 100" fill="none" stroke="#7b8399" stroke-width="3"/>
  <circle cx="160" cy="125" r="10" fill="#c0392f"/>
</svg>
