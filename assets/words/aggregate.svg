<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Four short bars of different heights feeding along arrows into one tall bar as high as all of them put together">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the line everything stands on -->
  <path d="M16 202 L304 202" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- the four separate quantities, drawn pale because none of them is the answer -->
  <g fill="#4f46e5" opacity=".6">
    <rect x="24" y="172" width="26" height="30"/>
    <rect x="58" y="158" width="26" height="44"/>
    <rect x="92" y="176" width="26" height="26"/>
    <rect x="126" y="164" width="26" height="38"/>
  </g>
  <!-- each one flowing across to the same point -->
  <g fill="none" stroke="#7b8399" stroke-width="3">
    <path d="M50 187 Q140 184 208 134"/>
    <path d="M84 180 Q150 178 208 134"/>
    <path d="M118 189 Q160 182 208 134"/>
    <path d="M152 183 Q180 168 208 134"/>
  </g>
  <!-- the arrow into the total -->
  <g fill="#7b8399">
    <rect x="204" y="128" width="26" height="8"/>
    <path d="M226 120 L242 132 L226 144 Z"/>
  </g>
  <!-- the total: one bar as tall as the four added up -->
  <rect x="246" y="64" width="52" height="138" fill="#4f46e5"/>
</svg>
