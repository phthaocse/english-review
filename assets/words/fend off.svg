<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A raised shield with two arrows striking it and glancing away to the sides instead of getting through">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the two incoming arrows, bending away where they meet the shield -->
  <g fill="none" stroke="#c0392f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 66 L126 100 L212 34"/>
    <path d="M14 186 L126 152 L212 214"/>
  </g>
  <g fill="#c0392f">
    <path d="M216 30 L192 32 L204 50 Z"/>
    <path d="M216 218 L192 216 L204 198 Z"/>
  </g>
  <!-- the shield held up in the way -->
  <path d="M164 46 L216 70 L216 126 Q216 172 164 196 Q112 172 112 126 L112 70 Z"
        fill="#4f46e5"/>
  <!-- the boss, so the flat shape reads as a shield and not a leaf -->
  <g fill="none" stroke="#eef0f5" stroke-width="5">
    <path d="M164 62 L200 78 L200 124 Q200 158 164 178 Q128 158 128 124 L128 78 Z"/>
  </g>
</svg>
