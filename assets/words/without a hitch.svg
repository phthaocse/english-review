<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A rope running smoothly through three rings from one end of the frame to the other with no knot or tangle anywhere along it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the rope, running clean from end to end -->
  <path d="M6 132 C80 158, 240 158, 314 132" fill="none" stroke="#a8841c" stroke-width="20" stroke-linecap="round"/>
  <path d="M6 132 C80 158, 240 158, 314 132" fill="none" stroke="#e0b73a" stroke-width="8" stroke-linecap="round"/>
  <!-- the twist of the rope, so it reads as rope and not a pipe -->
  <g stroke="#a8841c" stroke-width="4" stroke-linecap="round">
    <path d="M28 132 L36 144"/><path d="M88 148 L96 158"/><path d="M196 152 L204 162"/>
    <path d="M254 145 L262 155"/><path d="M300 130 L306 141"/>
  </g>
  <!-- the rings it has to pass through, every one of them clear -->
  <g fill="none" stroke="#7b8399" stroke-width="9">
    <circle cx="53" cy="144" r="30"/>
    <circle cx="160" cy="152" r="30"/>
    <circle cx="267" cy="144" r="30"/>
  </g>
  <!-- nothing went wrong -->
  <path d="M196 58 l16 20 l34 -48" fill="none" stroke="#2f6b4f" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
