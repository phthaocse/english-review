<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="The wide river held back in pale outline while the one small channel that leaves it and then runs its own course beside it is picked out in solid green">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the big channel, still there but not the point on this card -->
  <path d="M0 58 C 80 42, 210 78, 320 54 L320 148 C 210 172, 80 136, 0 152 Z" fill="#4f46e5" fill-opacity=".14"/>
  <g fill="none" stroke="#9aa2b4" stroke-width="5">
    <path d="M0 58 C 80 42, 210 78, 320 54"/>
    <path d="M0 152 C 80 136, 210 172, 320 148"/>
  </g>
  <g fill="none" stroke="#4f46e5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".3">
    <path d="M29 84 L49 94 L29 104"/><path d="M87 88 L107 98 L87 108"/>
    <path d="M145 94 L165 104 L145 114"/><path d="M203 98 L223 108 L203 118"/>
    <path d="M261 92 L281 102 L261 112"/>
  </g>
  <!-- the small channel that breaks away from it and then keeps its own course alongside -->
  <path d="M142 144 C 172 190, 214 200, 320 192 L320 224 C 210 232, 168 212, 190 140 Z"
        fill="#2f6b4f" fill-opacity=".55"/>
  <g fill="none" stroke="#2f6b4f" stroke-width="5">
    <path d="M142 144 C 172 190, 214 200, 320 192"/>
    <path d="M190 140 C 168 212, 210 232, 320 224"/>
  </g>
  <!-- it is the same water, running the same way -->
  <g fill="none" stroke="#2f6b4f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 197 L254 207 L240 217"/>
    <path d="M288 196 L302 206 L288 216"/>
  </g>
</svg>
