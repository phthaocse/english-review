<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Three small panels side by side: teeth biting through a hard biscuit, a calendar squeezed narrow by arrows pressing in from both sides, and a stack of data rows flattened by a press into one short result">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the rules dividing the three senses -->
  <g stroke="#9aa2b4" stroke-width="2">
    <path d="M106 16 L106 224"/><path d="M214 16 L214 224"/>
  </g>

  <!-- sense one: the sound of biting something hard -->
  <g fill="#ffffff" stroke="#7b8399" stroke-width="3">
    <rect x="22" y="58" width="16" height="26" rx="5"/>
    <rect x="44" y="58" width="16" height="26" rx="5"/>
    <rect x="66" y="58" width="16" height="26" rx="5"/>
    <rect x="22" y="152" width="16" height="26" rx="5"/>
    <rect x="44" y="152" width="16" height="26" rx="5"/>
    <rect x="66" y="152" width="16" height="26" rx="5"/>
  </g>
  <circle cx="52" cy="118" r="30" fill="#e0b73a" stroke="#a8841c" stroke-width="3"/>
  <circle cx="78" cy="98" r="18" fill="#eef0f5"/>
  <g fill="#c9a227">
    <circle cx="90" cy="130" r="4"/><circle cx="84" cy="144" r="3"/><circle cx="20" cy="132" r="4"/>
  </g>

  <!-- sense two: a stretch of time squeezed short -->
  <rect x="142" y="88" width="36" height="66" rx="4" fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <rect x="142" y="88" width="36" height="14" rx="4" fill="#4f46e5"/>
  <g stroke="#9aa2b4" stroke-width="3">
    <path d="M142 118 L178 118"/><path d="M142 136 L178 136"/><path d="M160 102 L160 154"/>
  </g>
  <g fill="#c0392f">
    <path d="M114 110 L136 110 L136 100 L142 121 L136 142 L136 132 L114 132 Z"/>
    <path d="M206 110 L184 110 L184 100 L178 121 L184 142 L184 132 L206 132 Z"/>
  </g>

  <!-- sense three: working through a mass of numbers -->
  <g fill="#c0392f">
    <path d="M254 58 L282 58 L282 48 L296 66 L282 84 L282 74 L254 74 Z" transform="rotate(90 268 66)"/>
  </g>
  <rect x="230" y="92" width="76" height="12" rx="3" fill="#7b8399"/>
  <g fill="#9aa2b4" stroke="#7b8399" stroke-width="2">
    <rect x="234" y="114" width="20" height="9"/><rect x="258" y="114" width="20" height="9"/><rect x="282" y="114" width="20" height="9"/>
    <rect x="234" y="127" width="20" height="9"/><rect x="258" y="127" width="20" height="9"/><rect x="282" y="127" width="20" height="9"/>
    <rect x="234" y="140" width="20" height="9"/><rect x="258" y="140" width="20" height="9"/><rect x="282" y="140" width="20" height="9"/>
  </g>
  <rect x="244" y="176" width="52" height="16" rx="4" fill="#4f46e5"/>
</svg>
