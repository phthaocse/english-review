<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="An hourglass whose sand runs straight down into an open box marked with a checklist, so none of it lands on the ground">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the hourglass: the time being used up -->
  <rect x="116" y="18" width="88" height="11" rx="3" fill="#7b8399"/>
  <path d="M124 29 L196 29 L160 76 L196 120 L124 120 L160 76 Z"
        fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <path d="M131 44 L189 44 L160 76 Z" fill="#e0b73a"/>
  <rect x="155" y="72" width="10" height="48" fill="#e0b73a"/>
  <path d="M128 119 L192 119 L172 102 L148 102 Z" fill="#e0b73a"/>
  <rect x="116" y="120" width="88" height="11" rx="3" fill="#7b8399"/>
  <!-- the sand going somewhere, not spilling -->
  <path d="M154 131 L166 131 L170 172 L150 172 Z" fill="#e0b73a"/>
  <g fill="#c9a227">
    <circle cx="146" cy="150" r="3"/><circle cx="175" cy="160" r="3"/>
  </g>
  <!-- the job it is being put into -->
  <path d="M102 176 L102 208 Q102 222 118 222 L202 222 Q218 222 218 208 L218 176 Z" fill="#4f46e5"/>
  <ellipse cx="160" cy="176" rx="58" ry="15" fill="#7b8399"/>
  <ellipse cx="160" cy="176" rx="47" ry="10" fill="#3730a3"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M116 196 L123 203 L136 188"/>
    <path d="M146 196 L200 196"/>
    <path d="M116 212 L123 219 L136 204"/>
    <path d="M146 212 L186 212"/>
  </g>
  <!-- the ground, with nothing on it -->
  <path d="M20 232 L300 232" stroke="#7b8399" stroke-width="3" stroke-linecap="round"/>
</svg>
