<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person shrugging with both palms turned up as if they have no idea, while the thought bubble behind them shows a lit bulb because they already know the answer">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- what they are really thinking: they knew all along -->
  <ellipse cx="236" cy="70" rx="70" ry="48" fill="#ffffff" stroke="#c0392f" stroke-width="4"/>
  <g fill="#c0392f">
    <circle cx="236" cy="62" r="19"/>
    <rect x="228" y="80" width="16" height="12" rx="3"/>
    <rect x="230" y="94" width="12" height="6" rx="3"/>
  </g>
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
    <path d="M204 34 L212 42"/><path d="M268 34 L260 42"/><path d="M236 24 L236 34"/>
  </g>
  <circle cx="168" cy="118" r="10" fill="#ffffff" stroke="#c0392f" stroke-width="3"/>
  <circle cx="152" cy="136" r="6" fill="#ffffff" stroke="#c0392f" stroke-width="3"/>
  <!-- the shrug they are performing: palms open, I would not know -->
  <circle cx="102" cy="112" r="24" fill="#4f46e5"/>
  <path d="M78 156 L126 156 L136 220 L68 220 Z" fill="#4f46e5"/>
  <g fill="none" stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 162 L44 180 L34 154"/>
    <path d="M124 162 L158 182 L166 158"/>
  </g>
  <g fill="#4f46e5">
    <circle cx="32" cy="148" r="11"/>
    <circle cx="168" cy="152" r="11"/>
  </g>
  <!-- the little marks that say the shoulders are up -->
  <g fill="none" stroke="#7b8399" stroke-width="4" stroke-linecap="round">
    <path d="M62 132 Q68 122 76 126"/>
    <path d="M142 134 Q136 124 128 128"/>
  </g>
</svg>
