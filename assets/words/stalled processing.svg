<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Items backed up on a conveyor behind a closed gate, nothing broken and nothing moving, with a clock running beside them">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- time going by while nothing happens -->
  <g>
    <circle cx="62" cy="58" r="30" fill="#eef0f5" stroke="#7b8399" stroke-width="5"/>
    <g stroke="#7b8399" stroke-width="3" stroke-linecap="round">
      <path d="M62 34 L62 40"/><path d="M62 76 L62 82"/>
      <path d="M38 58 L44 58"/><path d="M80 58 L86 58"/>
    </g>
    <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
      <path d="M62 58 L62 40"/><path d="M62 58 L78 66"/>
    </g>
  </g>
  <!-- work still arriving from upstream -->
  <g fill="#9aa2b4">
    <rect x="4" y="112" width="20" height="7"/>
    <path d="M22 106 L38 115 L22 124 Z"/>
  </g>
  <!-- the belt and its rollers -->
  <rect x="4" y="160" width="252" height="16" fill="#7b8399"/>
  <g fill="#9aa2b4">
    <circle cx="24" cy="168" r="12"/><circle cx="130" cy="168" r="12"/><circle cx="236" cy="168" r="12"/>
  </g>
  <!-- the queue piling up behind, pressed nose to tail -->
  <g fill="#4f46e5" opacity=".75">
    <rect x="50" y="126" width="32" height="34" rx="3"/>
    <rect x="86" y="126" width="32" height="34" rx="3"/>
    <rect x="122" y="126" width="32" height="34" rx="3"/>
    <rect x="158" y="126" width="32" height="34" rx="3"/>
  </g>
  <!-- the one at the head: intact, in position, and going nowhere -->
  <rect x="194" y="126" width="32" height="34" rx="3" fill="#4f46e5" stroke="#c0392f" stroke-width="4"/>
  <!-- the gate that has come down in front of it -->
  <rect x="248" y="52" width="10" height="130" fill="#7b8399"/>
  <rect x="232" y="96" width="12" height="66" fill="#c0392f"/>
  <rect x="232" y="90" width="26" height="12" fill="#7b8399"/>
</svg>
