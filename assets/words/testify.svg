<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A witness standing in the box with one hand raised, speaking across to a judge's bench with a gavel lying on it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the witness box -->
  <g fill="#9aa2b4">
    <rect x="176" y="132" width="122" height="88"/>
    <rect x="168" y="120" width="138" height="16" rx="4"/>
  </g>
  <!-- the witness: hand up, giving evidence -->
  <g fill="#4f46e5" stroke="#4f46e5">
    <circle cx="228" cy="62" r="19"/>
    <path d="M198 132 Q200 90 228 88 Q256 90 258 132 Z"/>
    <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M254 102 L270 76"/>
    </g>
    <circle cx="273" cy="68" r="11"/>
  </g>
  <!-- the words going across to the bench -->
  <g fill="none" stroke="#4f46e5" stroke-width="4" stroke-linecap="round">
    <path d="M204 70 A22 22 0 0 0 204 42"/>
    <path d="M190 78 A34 34 0 0 0 190 34"/>
    <path d="M176 86 A46 46 0 0 0 176 26"/>
  </g>
  <!-- the bench it is being said to -->
  <g fill="#7b8399">
    <rect x="12" y="146" width="128" height="76"/>
    <rect x="4" y="132" width="144" height="18" rx="4"/>
  </g>
  <!-- the gavel resting on it -->
  <ellipse cx="54" cy="128" rx="30" ry="9" fill="#9aa2b4"/>
  <g fill="#c9a227" transform="rotate(-14 62 110)">
    <rect x="30" y="92" width="48" height="24" rx="5"/>
    <rect x="74" y="99" width="54" height="11" rx="5"/>
  </g>
</svg>
