<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="The same balance, this time dragged right down on the left by a heavy cracked iron weight, with a red arrow falling beside the loaded side">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- where the beam would sit if nothing were on it -->
  <path d="M34 112 H290" stroke="#9aa2b4" stroke-width="3" stroke-dasharray="8 8"/>
  <!-- the stand: the same fulcrum as on the opposite card -->
  <g fill="#9aa2b4">
    <path d="M165 116 L200 200 L130 200 Z"/>
    <rect x="106" y="196" width="118" height="10" rx="5" fill="#7b8399"/>
  </g>
  <!-- the beam, tipped the other way -->
  <g transform="rotate(-15 165 112)">
    <rect x="73" y="107" width="184" height="10" rx="5" fill="#7b8399"/>
  </g>
  <!-- the empty pan, riding high -->
  <g stroke="#7b8399" stroke-width="3" fill="none">
    <path d="M254 90 L232 124"/><path d="M254 90 L276 124"/>
  </g>
  <path d="M228 124 Q254 146 280 124" fill="#9aa2b4"/>
  <!-- the loaded pan, pulled right down -->
  <g stroke="#7b8399" stroke-width="3" fill="none">
    <path d="M76 136 L46 176"/><path d="M76 136 L106 176"/>
  </g>
  <path d="M42 176 Q76 198 110 176" fill="#9aa2b4"/>
  <!-- dead weight: a plain iron ball with a lifting ring, and a crack in it -->
  <circle cx="76" cy="146" r="30" fill="#9aa2b4" stroke="#7b8399" stroke-width="4"/>
  <path d="M66 120 Q76 106 86 120" fill="none" stroke="#7b8399" stroke-width="7"/>
  <path d="M64 128 L74 146 L60 154 L72 170" fill="none" stroke="#c0392f" stroke-width="5" stroke-linecap="round"/>
  <!-- which way this side moves you -->
  <g fill="#c0392f" stroke="#c0392f" stroke-width="8" stroke-linecap="round">
    <path d="M20 82 L20 156"/>
    <path d="M8 152 L32 152 L20 176 Z" stroke="none"/>
  </g>
</svg>
