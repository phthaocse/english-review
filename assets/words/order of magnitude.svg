<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Three bars on one baseline, the second ten times the height of the first and the third ten times the second">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the three quantities, drawn to true scale: 1, then 10, then 100 -->
  <g fill="#4f46e5">
    <rect x="34" y="206" width="56" height="2"/>
    <rect x="126" y="188" width="56" height="20"/>
    <rect x="218" y="8" width="56" height="200"/>
  </g>
  <!-- the ground they are all measured from -->
  <path d="M18 208 H302" stroke="#7b8399" stroke-width="4"/>
  <!-- each step is the same step: one multiplication by ten -->
  <g fill="none" stroke="#c0392f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 202 Q110 182 122 186"/><path d="M112 180 L124 185 L118 196"/>
    <path d="M188 182 Q204 100 212 26"/><path d="M204 20 L215 24 L212 36"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#c0392f" text-anchor="middle">
    <text x="106" y="172">x10</text>
    <text x="176" y="100">x10</text>
  </g>
  <!-- the values, since scale alone cannot say which numbers these are -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="bold" fill="#4f46e5" text-anchor="middle">
    <text x="62" y="231">1</text>
    <text x="154" y="231">10</text>
    <text x="246" y="231">100</text>
  </g>
</svg>
