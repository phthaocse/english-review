<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person standing in a courtroom witness box with one hand raised to swear that what they saw is true">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the person, seen from the chest up -->
  <circle cx="132" cy="70" r="24" fill="#4f46e5"/>
  <path d="M84 176 L90 124 Q132 100 174 124 L180 176 Z" fill="#4f46e5"/>
  <!-- the raised hand: the gesture that makes it an oath and not just standing there -->
  <path d="M172 128 L202 80" stroke="#4f46e5" stroke-width="18" stroke-linecap="round"/>
  <g fill="#4f46e5">
    <rect x="192" y="34" width="42" height="44" rx="9"/>
    <rect x="194" y="14" width="9" height="26" rx="4.5"/>
    <rect x="205" y="10" width="9" height="30" rx="4.5"/>
    <rect x="216" y="12" width="9" height="28" rx="4.5"/>
    <rect x="227" y="20" width="9" height="22" rx="4.5"/>
    <rect x="178" y="44" width="20" height="10" rx="5"/>
  </g>
  <!-- the box they have been put in to give evidence -->
  <rect x="52" y="168" width="216" height="62" fill="#9aa2b4"/>
  <rect x="44" y="156" width="232" height="18" rx="6" fill="#7b8399"/>
  <g stroke="#7b8399" stroke-width="4" fill="none">
    <rect x="72" y="184" width="80" height="34"/>
    <rect x="168" y="184" width="80" height="34"/>
  </g>
  <path d="M0 230 H320" stroke="#7b8399" stroke-width="4"/>
</svg>
