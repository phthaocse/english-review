<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A walker whose footsteps get shorter and shorter as one barrier after another is put across the way ahead">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ground walked over -->
  <path d="M8 194 L312 194" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
  <!-- the trail: long free strides at the start, cramped ones by the end -->
  <g fill="#9aa2b4">
    <ellipse cx="18" cy="204" rx="9" ry="5"/>
    <ellipse cx="46" cy="204" rx="9" ry="5"/>
    <ellipse cx="72" cy="204" rx="9" ry="5"/>
    <ellipse cx="90" cy="204" rx="9" ry="5"/>
    <ellipse cx="102" cy="204" rx="9" ry="5"/>
  </g>
  <!-- the walker, barely able to take a step now -->
  <g fill="#4f46e5" stroke="#4f46e5">
    <circle cx="118" cy="98" r="13"/>
    <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M118 112 L118 148"/>
      <path d="M118 120 L136 132"/>
      <path d="M118 120 L102 134"/>
      <path d="M118 148 L126 170 L124 192"/>
      <path d="M118 148 L110 170 L112 192"/>
    </g>
  </g>
  <!-- one barrier after another, each one costing more effort -->
  <g>
    <g stroke="#7b8399" stroke-width="6" stroke-linecap="round">
      <path d="M160 150 L160 194"/><path d="M196 150 L196 194"/>
    </g>
    <rect x="152" y="138" width="52" height="14" rx="4" fill="#c0392f"/>
  </g>
  <g>
    <g stroke="#7b8399" stroke-width="6" stroke-linecap="round">
      <path d="M218 150 L218 194"/><path d="M254 150 L254 194"/>
    </g>
    <rect x="210" y="138" width="52" height="14" rx="4" fill="#c0392f"/>
  </g>
  <g>
    <g stroke="#7b8399" stroke-width="6" stroke-linecap="round">
      <path d="M276 150 L276 194"/><path d="M308 150 L308 194"/>
    </g>
    <rect x="268" y="138" width="48" height="14" rx="4" fill="#c0392f"/>
  </g>
</svg>
