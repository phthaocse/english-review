<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two demand charts side by side: the same drop in price moves quantity only a little on the steep curve but a great deal on the flat one">
  <rect width="320" height="240" fill="#eef0f5"/>

  <!-- left chart: a steep curve, so price barely moves demand -->
  <g stroke="#7b8399" stroke-width="3" stroke-linecap="round">
    <path d="M42 44 L42 190"/><path d="M42 190 L150 190"/>
  </g>
  <path d="M58 56 L98 188" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#9aa2b4" stroke-width="2" stroke-dasharray="6 5">
    <path d="M42 80 L65 80"/><path d="M42 130 L80 130"/>
    <path d="M65 80 L65 190"/><path d="M80 130 L80 190"/>
  </g>
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
    <path d="M32 82 L32 124"/>
    <path d="M25 118 L32 130 L39 118"/>
    <path d="M65 204 L80 204"/><path d="M65 198 L65 210"/><path d="M80 198 L80 210"/>
  </g>

  <!-- right chart: a flat curve, so the same drop moves demand a long way -->
  <g stroke="#7b8399" stroke-width="3" stroke-linecap="round">
    <path d="M196 44 L196 190"/><path d="M196 190 L308 190"/>
  </g>
  <path d="M204 62 L302 158" stroke="#4f46e5" stroke-width="7" stroke-linecap="round"/>
  <g stroke="#9aa2b4" stroke-width="2" stroke-dasharray="6 5">
    <path d="M196 80 L222 80"/><path d="M196 130 L273 130"/>
    <path d="M222 80 L222 190"/><path d="M273 130 L273 190"/>
  </g>
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round">
    <path d="M186 82 L186 124"/>
    <path d="M179 118 L186 130 L193 118"/>
    <path d="M222 204 L273 204"/><path d="M222 198 L222 210"/><path d="M273 198 L273 210"/>
  </g>
</svg>
