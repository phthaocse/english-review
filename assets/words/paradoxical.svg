<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="One unbroken ring made of two arrows that run the opposite way round and meet head to head, so the shape holds together while the two directions flatly contradict each other">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the half that runs over the top, arriving from the left -->
  <path d="M84 120 A76 76 0 0 1 232 96" fill="none" stroke="#4f46e5"
        stroke-width="11" stroke-linecap="round"/>
  <path d="M237 111 L222 95 L239 89 Z" fill="#4f46e5"/>
  <!-- the half that runs under the bottom, arriving from the same place the other way -->
  <path d="M84 120 A76 76 0 0 0 232 144" fill="none" stroke="#4f46e5"
        stroke-width="11" stroke-linecap="round"/>
  <path d="M237 129 L239 151 L222 145 Z" fill="#4f46e5"/>
  <!-- where the two directions collide, and the ring closes all the same -->
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round">
    <path d="M256 120 L276 120"/>
    <path d="M258 106 L272 98"/>
    <path d="M258 134 L272 142"/>
  </g>
</svg>
