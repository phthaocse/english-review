<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Three small panels: a heavy bag lifted off a person's shoulder, a badge pulled off a uniform leaving an empty outline behind, and a worried face easing as its frown lines float away">
  <rect width="320" height="240" fill="#eef0f5"/>

  <!-- panel one: the load taken off them -->
  <g>
    <rect x="46" y="24" width="54" height="44" rx="12" fill="#7b8399"/>
    <path d="M59 24 q14 -17 28 0" fill="none" stroke="#7b8399" stroke-width="6"/>
    <path d="M73 108 L73 82" stroke="#c0392f" stroke-width="8" stroke-linecap="round"/>
    <polygon points="59,86 87,86 73,62" fill="#c0392f"/>
    <circle cx="38" cy="102" r="15" fill="#4f46e5"/>
    <g stroke="#4f46e5" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M38 120 L38 160"/>
      <path d="M38 160 L27 210"/>
      <path d="M38 160 L51 210"/>
      <path d="M38 128 L60 134"/>
    </g>
  </g>

  <!-- panel two: the badge taken off them -->
  <g>
    <path d="M128 82 L148 64 L174 64 L194 82 L194 200 L128 200 Z" fill="#4f46e5"/>
    <path d="M148 64 L161 88 L174 64" fill="#eef0f5"/>
    <path d="M143 106 L179 106 L179 128 Q179 148 161 156 Q143 148 143 128 Z"
          fill="none" stroke="#eef0f5" stroke-width="4" stroke-dasharray="8 6"/>
    <path d="M182 104 Q190 86 194 70" fill="none" stroke="#c0392f" stroke-width="5" stroke-dasharray="7 6" stroke-linecap="round"/>
    <g transform="translate(190,40)">
      <path d="M-18 -16 L18 -16 L18 4 Q18 22 0 30 Q-18 22 -18 4 Z" fill="#e0b73a" stroke="#a8841c" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="0" cy="0" r="7" fill="#a8841c"/>
    </g>
  </g>

  <!-- panel three: the worry taken off them -->
  <g>
    <g fill="none" stroke="#9aa2b4" stroke-width="5" stroke-linecap="round">
      <path d="M236 50 q9 -10 18 0" opacity="0.8"/>
      <path d="M266 34 q9 -10 18 0" opacity="0.6"/>
      <path d="M292 58 q9 -10 18 0" opacity="0.45"/>
    </g>
    <circle cx="266" cy="134" r="44" fill="#ffffff" stroke="#4f46e5" stroke-width="5"/>
    <circle cx="250" cy="126" r="6" fill="#4f46e5"/>
    <circle cx="282" cy="126" r="6" fill="#4f46e5"/>
    <g stroke="#4f46e5" stroke-width="4" stroke-linecap="round">
      <path d="M240 108 L258 108"/><path d="M274 108 L292 108"/>
    </g>
    <path d="M244 152 Q266 172 288 152" fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- the rules dividing the three senses -->
  <g stroke="#9aa2b4" stroke-width="2">
    <path d="M107 10 L107 230"/><path d="M213 10 L213 230"/>
  </g>
</svg>
