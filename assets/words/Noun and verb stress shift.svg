<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="The same two-syllable word drawn twice: as a noun the stress dot sits over the first syllable block, as a verb the dot has moved to the second">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- as a noun: the beat lands on the first syllable -->
  <circle cx="152" cy="30" r="13" fill="#c0392f"/>
  <text x="16" y="88" font-family="Helvetica, Arial, sans-serif" font-size="23"
        font-weight="700" fill="#7b8399">noun</text>
  <rect x="106" y="50" width="92" height="52" rx="9" fill="#4f46e5"/>
  <rect x="206" y="50" width="96" height="52" rx="9" fill="#9aa2b4"/>
  <text x="152" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" fill="#ffffff">RE</text>
  <text x="254" y="86" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" fill="#ffffff">cord</text>
  <!-- as a verb: the same word, the dot moved to the back syllable -->
  <circle cx="254" cy="138" r="13" fill="#c0392f"/>
  <text x="16" y="196" font-family="Helvetica, Arial, sans-serif" font-size="23"
        font-weight="700" fill="#7b8399">verb</text>
  <rect x="106" y="158" width="92" height="52" rx="9" fill="#9aa2b4"/>
  <rect x="206" y="158" width="96" height="52" rx="9" fill="#4f46e5"/>
  <text x="152" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" fill="#ffffff">re</text>
  <text x="254" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="27" font-weight="700" fill="#ffffff">CORD</text>
</svg>
