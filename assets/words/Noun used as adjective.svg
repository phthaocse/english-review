<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="The empty slot that follows the word be, marked wrong when a noun block is dropped into it and right when an adjective block is">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the wrong fill: a noun in the slot after be -->
  <text x="18" y="86" font-family="Helvetica, Arial, sans-serif" font-size="38"
        font-weight="bold" fill="#4f46e5">be</text>
  <rect x="80" y="50" width="152" height="48" rx="8" fill="none"
        stroke="#9aa2b4" stroke-width="4" stroke-dasharray="9 7"/>
  <rect x="88" y="58" width="136" height="32" rx="5" fill="#9aa2b4"/>
  <text x="156" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#ffffff">noun</text>
  <g stroke="#c0392f" stroke-width="9" stroke-linecap="round">
    <path d="M252 54 L292 94"/><path d="M292 54 L252 94"/>
  </g>
  <!-- the rule separating the wrong version from the right one -->
  <path d="M18 130 L300 130" stroke="#9aa2b4" stroke-width="2"/>
  <!-- the right fill: an adjective in the very same slot -->
  <text x="18" y="198" font-family="Helvetica, Arial, sans-serif" font-size="38"
        font-weight="bold" fill="#4f46e5">be</text>
  <rect x="80" y="162" width="152" height="48" rx="8" fill="none"
        stroke="#9aa2b4" stroke-width="4" stroke-dasharray="9 7"/>
  <rect x="88" y="170" width="136" height="32" rx="5" fill="#4f46e5"/>
  <text x="156" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif"
        font-size="22" font-weight="bold" fill="#ffffff">adj</text>
  <path d="M252 182 L264 196 L294 162" fill="none" stroke="#2f6b4f"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
