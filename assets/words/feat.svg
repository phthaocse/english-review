<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A flag planted on the summit of a mountain with the long difficult zigzag route that had to be climbed marked out below it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the mountain that had to be got up -->
  <path d="M22 214 L106 100 L142 142 L194 48 L300 214 Z" fill="#9aa2b4"/>
  <!-- its shaded far face -->
  <path d="M194 48 L300 214 L210 214 Z" fill="#7b8399"/>
  <!-- the route: every switchback that made it hard -->
  <path d="M60 208 L104 180 L74 154 L124 128 L96 104 L146 86 L166 66 L190 52"
        fill="none" stroke="#c0392f" stroke-width="5"
        stroke-dasharray="10 8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the flag that says it was done -->
  <path d="M194 48 L194 8" stroke="#7b8399" stroke-width="5" stroke-linecap="round"/>
  <path d="M194 10 L248 24 L194 38 Z" fill="#4f46e5"/>
  <!-- the ground it was started from -->
  <path d="M6 214 L314 214" stroke="#7b8399" stroke-width="4" stroke-linecap="round"/>
</svg>
