<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A signed letter left on a desk, the chair shoved back at an angle, and the person already walking away with their back turned">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the desk they are leaving behind -->
  <rect x="14" y="150" width="164" height="14" rx="4" fill="#7b8399"/>
  <rect x="26" y="164" width="14" height="56" fill="#7b8399"/>
  <rect x="152" y="164" width="14" height="56" fill="#7b8399"/>
  <!-- the letter, signed and put down where it will be found -->
  <g transform="rotate(-6 98 132)">
    <rect x="48" y="112" width="100" height="38" rx="3" fill="#ffffff" stroke="#9aa2b4" stroke-width="3"/>
    <g stroke="#9aa2b4" stroke-width="3" stroke-linecap="round">
      <path d="M58 122 H132"/><path d="M58 130 H120"/>
    </g>
    <path d="M58 142 q10 -10 18 0 t18 0 t16 -2" fill="none" stroke="#c0392f"
          stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- the chair, shoved back and left at an angle -->
  <g transform="rotate(12 214 172)">
    <rect x="186" y="150" width="58" height="12" rx="4" fill="#9aa2b4"/>
    <rect x="234" y="104" width="12" height="52" rx="5" fill="#9aa2b4"/>
    <rect x="190" y="162" width="8" height="52" fill="#9aa2b4"/>
    <rect x="232" y="162" width="8" height="52" fill="#9aa2b4"/>
  </g>
  <!-- the person, back turned, on the way out -->
  <circle cx="280" cy="66" r="20" fill="#4f46e5"/>
  <path d="M252 152 Q252 92 280 88 Q308 92 308 152 Z" fill="#4f46e5"/>
  <g stroke="#4f46e5" stroke-width="18" stroke-linecap="round">
    <path d="M270 150 L258 212"/><path d="M290 150 L306 206"/>
  </g>
</svg>
