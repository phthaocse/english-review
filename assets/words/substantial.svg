<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A small light block beside a block many times its size, so heavy that the ground has sagged into a trough beneath it">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the ordinary amount, for comparison -->
  <g>
    <rect x="42" y="180" width="54" height="32" fill="#9aa2b4"/>
    <polygon points="42 180 56 168 110 168 96 180" fill="#b6bcc9"/>
    <polygon points="96 180 110 168 110 200 96 212" fill="#7b8399"/>
  </g>
  <!-- the substantial one: far bigger, and heavy enough to press the ground down -->
  <g>
    <rect x="150" y="44" width="140" height="184" fill="#4f46e5"/>
    <polygon points="150 44 174 22 314 22 290 44" fill="#6f68ea"/>
    <polygon points="290 44 314 22 314 206 290 228" fill="#3730a3"/>
  </g>
  <!-- the ground, sagging under the weight of it -->
  <path d="M0 212 H134 L150 230 H292 L308 212 H320" fill="none" stroke="#7b8399"
        stroke-width="6" stroke-linejoin="round"/>
  <!-- the load going down into it -->
  <g stroke="#c0392f" stroke-width="5" stroke-linecap="round">
    <path d="M178 234 L172 224"/><path d="M220 236 L220 226"/><path d="M262 234 L268 224"/>
  </g>
</svg>
