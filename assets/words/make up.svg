<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person talking, with a speech bubble in which a whole scene of a house and a sun is sketched in broken dashed lines rather than solid ones">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- what is being said -->
  <polygon points="104,120 80,168 116,152" fill="#ffffff"/>
  <rect x="100" y="22" width="200" height="132" rx="20" fill="#ffffff" stroke="#7b8399" stroke-width="3"/>
  <!-- a scene that was never there: nothing in it is a solid line -->
  <g fill="none" stroke="#4f46e5" stroke-width="4" stroke-dasharray="8 7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 138 L140 82 L200 82 L200 138 Z"/>
    <path d="M128 82 L170 50 L212 82"/>
    <path d="M158 138 L158 108 L182 108 L182 138"/>
    <circle cx="258" cy="66" r="20"/>
    <path d="M258 32 L258 40"/><path d="M258 92 L258 100"/>
    <path d="M224 66 L232 66"/><path d="M284 66 L292 66"/>
    <path d="M234 42 L240 48"/><path d="M276 84 L282 90"/>
    <path d="M282 42 L276 48"/><path d="M240 84 L234 90"/>
  </g>
  <!-- the person telling it -->
  <circle cx="54" cy="178" r="26" fill="#4f46e5"/>
  <ellipse cx="60" cy="190" rx="9" ry="7" fill="#eef0f5"/>
  <path d="M8 240 C 8 214, 30 204, 54 204 C 78 204, 100 214, 100 240 Z" fill="#4f46e5"/>
</svg>
