<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="Two blocks of writing at the top, arrows running down from both of them and joining into one arrow, which arrives at a third block carrying a tick">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the two things already agreed -->
  <g fill="#ffffff" stroke="#4f46e5" stroke-width="3">
    <rect x="22" y="26" width="118" height="62" rx="8"/>
    <rect x="180" y="26" width="118" height="62" rx="8"/>
  </g>
  <g stroke="#9aa2b4" stroke-width="5" stroke-linecap="round">
    <path d="M40 46 L122 46"/><path d="M40 62 L122 62"/><path d="M40 78 L96 78"/>
    <path d="M198 46 L280 46"/><path d="M198 62 L280 62"/><path d="M198 78 L254 78"/>
  </g>
  <!-- and the step from them that nobody has to argue for -->
  <g fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round">
    <path d="M81 92 L140 126"/><path d="M239 92 L180 126"/><path d="M160 126 L160 146"/>
  </g>
  <polygon points="160,162 148,142 172,142" fill="#4f46e5"/>
  <!-- what follows from them -->
  <rect x="86" y="166" width="148" height="62" rx="8" fill="#4f46e5"/>
  <path d="M132 198 L152 216 L192 176" fill="none" stroke="#ffffff" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
