<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A small mast putting out two faint short arcs, three larger masts picking them up, and from those masts a broadcast of long sweeping arcs reaching far across the picture">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the first mast, and how little of it gets out -->
  <g fill="#7b8399">
    <polygon points="44,100 55,134 33,134"/>
    <rect x="31" y="134" width="26" height="6"/>
    <circle cx="44" cy="98" r="4"/>
  </g>
  <g fill="none" stroke="#7b8399" stroke-width="2.5">
    <path d="M53.0 87.3 A14 14 0 0 1 53.0 108.7"/>
    <path d="M58.1 81.1 A22 22 0 0 1 58.1 114.9"/>
  </g>
  <!-- the three who hear it -->
  <g stroke="#9aa2b4" stroke-width="2" stroke-dasharray="3 5" fill="none">
    <path d="M64 96 L108 52"/><path d="M64 100 L108 118"/><path d="M64 104 L108 186"/>
  </g>
  <g fill="#7b8399">
    <polygon points="118,46 129,80 107,80"/><rect x="105" y="80" width="26" height="6"/>
    <polygon points="118,118 129,152 107,152"/><rect x="105" y="152" width="26" height="6"/>
    <polygon points="118,190 129,224 107,224"/><rect x="105" y="224" width="26" height="6"/>
  </g>
  <!-- and how much further it goes once they send it on -->
  <g fill="none" stroke="#4f46e5" stroke-width="7" stroke-linecap="round">
    <path d="M152.4 68.8 A60 60 0 0 1 152.4 167.2"/>
    <path d="M170.8 42.6 A92 92 0 0 1 170.8 193.4"/>
    <path d="M189.1 16.4 A124 124 0 0 1 189.1 219.6"/>
  </g>
  <g fill="none" stroke="#4f46e5" stroke-width="6" stroke-linecap="round">
    <path d="M133.4 27.6 A24 24 0 0 1 133.4 64.4"/>
    <path d="M133.4 171.6 A24 24 0 0 1 133.4 208.4"/>
  </g>
</svg>
