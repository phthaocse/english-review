<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A road seen from above with both lanes filled nose to tail by cars and buses that cannot move, though nothing at all stands in their way">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- pavements either side, so the strip reads as a road -->
  <rect x="0" y="0" width="60" height="240" fill="#cdd3e0"/>
  <rect x="260" y="0" width="60" height="240" fill="#cdd3e0"/>
  <rect x="60" y="0" width="200" height="240" fill="#7b8399"/>
  <g stroke="#9aa2b4" stroke-width="4">
    <path d="M60 0 L60 240"/><path d="M260 0 L260 240"/>
  </g>
  <path d="M160 0 L160 240" stroke="#eef0f5" stroke-width="5" stroke-dasharray="20 16"/>
  <!-- the near lane: a bus stuck in the queue among the cars, bumper to bumper -->
  <g stroke="#3730a3" stroke-width="2">
    <rect x="73" y="2"   width="74" height="42" rx="11" fill="#4f46e5"/>
    <rect x="73" y="52"  width="74" height="78" rx="11" fill="#9aa2b4"/>
    <rect x="73" y="138" width="74" height="42" rx="11" fill="#c0392f"/>
    <rect x="73" y="188" width="74" height="42" rx="11" fill="#4f46e5"/>
  </g>
  <g fill="#eef0f5" opacity=".9">
    <rect x="82" y="9"   width="56" height="11" rx="5"/><rect x="86" y="30"  width="48" height="8" rx="4"/>
    <rect x="82" y="59"  width="56" height="11" rx="5"/>
    <rect x="86" y="80"  width="48" height="8" rx="4"/><rect x="86" y="96"  width="48" height="8" rx="4"/>
    <rect x="86" y="112" width="48" height="8" rx="4"/>
    <rect x="82" y="145" width="56" height="11" rx="5"/><rect x="86" y="166" width="48" height="8" rx="4"/>
    <rect x="82" y="195" width="56" height="11" rx="5"/><rect x="86" y="216" width="48" height="8" rx="4"/>
  </g>
  <!-- the far lane, just as solid, with a lorry in it -->
  <g stroke="#3730a3" stroke-width="2">
    <rect x="173" y="-16" width="74" height="42" rx="11" fill="#9aa2b4"/>
    <rect x="173" y="34"  width="74" height="42" rx="11" fill="#4f46e5"/>
    <rect x="173" y="84"  width="74" height="80" rx="11" fill="#4f46e5"/>
    <rect x="173" y="172" width="74" height="42" rx="11" fill="#9aa2b4"/>
    <rect x="173" y="222" width="74" height="42" rx="11" fill="#4f46e5"/>
  </g>
  <g fill="#eef0f5" opacity=".9">
    <rect x="182" y="8"   width="56" height="11" rx="5"/><rect x="186" y="-8"  width="48" height="8" rx="4"/>
    <rect x="182" y="58"  width="56" height="11" rx="5"/><rect x="186" y="42"  width="48" height="8" rx="4"/>
    <rect x="182" y="146" width="56" height="11" rx="5"/>
    <rect x="186" y="96"  width="48" height="8" rx="4"/><rect x="186" y="112" width="48" height="8" rx="4"/>
    <rect x="182" y="196" width="56" height="11" rx="5"/><rect x="186" y="180" width="48" height="8" rx="4"/>
    <rect x="182" y="246" width="56" height="11" rx="5"/><rect x="186" y="230" width="48" height="8" rx="4"/>
  </g>
</svg>
