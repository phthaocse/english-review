<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A crowd behind a rail all tipped over and reaching towards the runner in last place rather than towards the leader out in front">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the crowd, every one of them tipped the same way -->
  <g>
    <g transform="translate(18,152) rotate(26)">
      <path d="M0 -70 L0 0" stroke="#7b8399" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -54 L28 -70" stroke="#7b8399" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="13" fill="#7b8399"/>
    </g>
    <g transform="translate(56,152) rotate(22)">
      <path d="M0 -70 L0 0" stroke="#7b8399" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -54 L28 -70" stroke="#7b8399" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="13" fill="#7b8399"/>
    </g>
    <g transform="translate(94,152) rotate(17)">
      <path d="M0 -70 L0 0" stroke="#7b8399" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -54 L28 -70" stroke="#7b8399" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="13" fill="#7b8399"/>
    </g>
    <g transform="translate(206,152) rotate(-20)">
      <path d="M0 -70 L0 0" stroke="#7b8399" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -54 L-28 -70" stroke="#7b8399" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="13" fill="#7b8399"/>
    </g>
    <g transform="translate(244,152) rotate(-25)">
      <path d="M0 -70 L0 0" stroke="#7b8399" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -54 L-28 -70" stroke="#7b8399" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="13" fill="#7b8399"/>
    </g>
    <g transform="translate(282,152) rotate(-30)">
      <path d="M0 -70 L0 0" stroke="#7b8399" stroke-width="16" stroke-linecap="round"/>
      <path d="M0 -54 L-28 -70" stroke="#7b8399" stroke-width="9" stroke-linecap="round"/>
      <circle cx="0" cy="-84" r="13" fill="#7b8399"/>
    </g>
  </g>
  <!-- where all that attention is aimed -->
  <g stroke="#c0392f" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 7">
    <path d="M100 122 L132 150"/>
    <path d="M196 122 L174 148"/>
  </g>
  <polygon points="130,138 142,158 124,154" fill="#c0392f"/>
  <polygon points="178,136 168,156 184,152" fill="#c0392f"/>
  <!-- the rail holding them off the track -->
  <rect x="0" y="152" width="320" height="14" fill="#7b8399"/>
  <path d="M0 228 L320 228" stroke="#9aa2b4" stroke-width="5"/>
  <!-- the leader, well clear and roundly ignored -->
  <g transform="translate(278,228) scale(0.92)">
    <g stroke="#9aa2b4" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M4 -64 L-4 -32"/><path d="M2 -60 L22 -48"/><path d="M2 -60 L-18 -50"/>
      <path d="M-4 -32 L16 -18 L22 0"/><path d="M-4 -32 L-22 -20 L-28 -2"/>
    </g>
    <circle cx="8" cy="-78" r="13" fill="#9aa2b4"/>
  </g>
  <!-- the one in last place, who has the whole crowd -->
  <g transform="translate(148,228)">
    <g stroke="#4f46e5" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M4 -64 L-4 -32"/><path d="M2 -60 L24 -48"/><path d="M2 -60 L-20 -50"/>
      <path d="M-4 -32 L18 -18 L26 0"/><path d="M-4 -32 L-24 -20 L-32 -2"/>
    </g>
    <circle cx="8" cy="-78" r="14" fill="#4f46e5"/>
  </g>
</svg>
