<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img"
     aria-label="A person reading from one open book held close to their face while a sweeping stroke pushes a scatter of mixed-coloured facts off the edge of the picture">
  <rect width="320" height="240" fill="#eef0f5"/>
  <!-- the reader, who takes everything from this one book -->
  <circle cx="72" cy="72" r="24" fill="#4f46e5"/>
  <path d="M38 224 Q38 112 72 108 Q106 112 106 224 Z" fill="#4f46e5"/>
  <!-- the single book, held open and never put down -->
  <path d="M26 130 L100 118 L100 176 L26 188 Z" fill="#ffffff" stroke="#7b8399"
        stroke-width="4" stroke-linejoin="round"/>
  <path d="M102 118 L150 130 L150 188 L102 176 Z" fill="#ffffff" stroke="#7b8399"
        stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#9aa2b4" stroke-width="4" stroke-linecap="round">
    <path d="M38 142 L88 134"/><path d="M38 156 L88 148"/><path d="M38 170 L74 163"/>
    <path d="M114 134 L140 141"/><path d="M114 148 L140 155"/>
  </g>
  <!-- the evidence, all shapes and colours, being swept out of the way -->
  <g>
    <circle cx="196" cy="152" r="14" fill="#e0b73a"/>
    <circle cx="232" cy="124" r="10" fill="#2f6b4f"/>
    <circle cx="256" cy="156" r="15" fill="#9aa2b4"/>
    <circle cx="288" cy="116" r="9" fill="#c9a227"/>
    <circle cx="302" cy="146" r="8" fill="#7b8399"/>
  </g>
  <g stroke="#9aa2b4" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <path d="M172 150 H182"/><path d="M212 124 H222"/><path d="M234 158 H242"/>
  </g>
  <!-- the sweep that clears them away -->
  <path d="M164 206 Q240 210 296 176" fill="none" stroke="#7b8399" stroke-width="11"
        stroke-linecap="round"/>
  <polygon points="310 168 282 172 294 190" fill="#7b8399"/>
</svg>
