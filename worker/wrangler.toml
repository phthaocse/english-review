# No secrets in this file. GEMINI_API_KEY is set with:
#   wrangler secret put GEMINI_API_KEY
# and is not readable afterwards, from the CLI or the dashboard.

name = "knowledge-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every past version would otherwise get its own public URL. This Worker
# holds an API key, so it gets one address, not one per deployment.
preview_urls = false

[vars]
# The OAuth client ID is public by design — it identifies the app, it does not
# authorise anything. The allowlist and the token signature do that.
GOOGLE_CLIENT_ID = "148321977918-2bmnoeuvcq5nf404o37f2ja38qtg3nl3.apps.googleusercontent.com"
ALLOWED_ORIGINS  = "https://phthaocse.github.io,http://localhost:8731"
GEMINI_MODEL     = "gemini-3.8-flash"

[[d1_databases]]
binding       = "DB"
database_name = "knowledge"
database_id = "680d82e4-b2b5-4982-9a92-981e30290a6b"
